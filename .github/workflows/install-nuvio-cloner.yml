name: Install Nuvio Cloner on Oracle
on:
  push:
    branches:
      - feature/nuvio-account-mirror-oracle
    paths:
      - .github/workflows/install-nuvio-cloner.yml
      - 'tools/nuvio-cloner/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test isolated cloner
        run: |
          node --check tools/nuvio-cloner/server-nuvio-login.mjs
          node --test tools/nuvio-cloner/test.mjs
          bash -n tools/nuvio-cloner/install-oracle.sh
      - name: Prepare Oracle credentials
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$RUNNER_TEMP/keys"
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/keys/oracle.pem"
          chmod 600 "$RUNNER_TEMP/keys/oracle.pem"
          ssh-keygen -y -f "$RUNNER_TEMP/keys/oracle.pem" >/dev/null
      - name: Install on existing Oracle instance
        run: |
          set -Eeuo pipefail
          ssh -i "$RUNNER_TEMP/keys/oracle.pem" -o StrictHostKeyChecking=accept-new ubuntu@141.145.215.202 'sudo bash -s' < tools/nuvio-cloner/install-oracle.sh
      - name: Validate public routing and catalogs
        run: |
          set -Eeuo pipefail
          origin='https://141-145-215-202.nip.io'
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 12 "$origin/cloner/")
          test "$code" = 200
          # Diagnose both entrypoint variants and the real browser API path,
          # without using or logging any Nuvio credentials.
          root_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 12 "$origin/cloner")
          test "$root_code" = 200 || test "$root_code" = 301 || test "$root_code" = 308
          curl -fsS --max-time 12 "$origin/cloner/health" | jq -e '.ok == true and .app == "nuvio-mirror"' >/dev/null
          api_code=$(curl -sS -o "$RUNNER_TEMP/cloner-profiles-check.json" -w '%{http_code}' --max-time 15 \
            -X POST -H 'Content-Type: application/json' -H 'X-Requested-With: NuvioMirror' \
            -H "Origin: $origin" -d '{"account":{"email":"invalid","password":""}}' \
            "$origin/cloner/api/profiles")
          if [[ "$api_code" != "400" ]] || ! jq -e '.error == "Identifiants Nuvio invalides"' "$RUNNER_TEMP/cloner-profiles-check.json" >/dev/null; then
            echo "Nuvio cloner API routing mismatch: HTTP $api_code (expected 400)" >&2
            jq -r '.error // "unexpected response"' "$RUNNER_TEMP/cloner-profiles-check.json" 2>/dev/null >&2 || true
            exit 1
          fi
          curl -fsS "$origin/_oracle/health" | jq -e '.ok == true' >/dev/null
          curl -fsS "$origin/fr/manifest.json" >/dev/null
