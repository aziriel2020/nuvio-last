name: D Smart Source Diagnostic
on:
  push:
    branches: [main]
    paths: [".github/dsmart-source-diagnostic-run"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve D-Smart GO public config without key
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 40 \
            -A "Mozilla/5.0 NuvioCalendarDiagnostic/6.0" \
            https://www.dsmartgo.com.tr/main.js -o "$RUNNER_TEMP/main.js"
          python3 - "$RUNNER_TEMP/main.js" <<'PY'
          import re,sys,json,subprocess,time
          s=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          anchor=s.find('url:"/client/site-config"')
          assert anchor >= 0
          region=s[max(0,anchor-2000):anchor+700]

          # Public client token embedded in the public website bundle.
          tokens=re.findall(r'["\']([A-Za-z0-9._-]{28,120})["\']',region)
          token=max(tokens,key=len) if tokens else None
          print('PUBLIC_CLIENT_LITERAL_FOUND',bool(token),'LEN',len(token or ''))
          if not token:
              raise SystemExit(2)
          print('::add-mask::'+token)

          url='https://bfogwjgq8dbp.merlincdn.net/client/site-config'
          cmd=[
              'curl','-sS','--connect-timeout','10','--max-time','25',
              '-o','/tmp/dsmart-config.json','-w','%{http_code}',
              '-H','Authorization: Bearer '+token,
              '-H','Accept: application/json',
              '--get',url,
              '--data-urlencode','version=1.0.5',
              '--data-urlencode','platform=web-desktop',
              '--data-urlencode','timestamp='+str(int(time.time()*1000)),
          ]
          p=subprocess.run(cmd,capture_output=True,text=True)
          status=p.stdout.strip()
          print('CONFIG_HTTP',status)
          if status != '200':
              body=open('/tmp/dsmart-config.json',encoding='utf-8',errors='replace').read()
              print('BODY_SAFE',re.sub(r'[A-Za-z0-9._-]{24,}','<redacted>',body[:600]))
              raise SystemExit(3)

          payload=json.load(open('/tmp/dsmart-config.json',encoding='utf-8'))
          root=payload.get('data',payload) if isinstance(payload,dict) else payload
          # Common response nesting is data.data.site_config.
          candidates=[]
          if isinstance(root,dict):
              candidates += [root]
              if isinstance(root.get('data'),dict): candidates.append(root['data'])
              if isinstance(root.get('site_config'),dict): candidates.append(root['site_config'])
              if isinstance(root.get('data'),dict) and isinstance(root['data'].get('site_config'),dict):
                  candidates.append(root['data']['site_config'])
          config=max(candidates,key=lambda x: len(json.dumps(x,ensure_ascii=False))) if candidates else root

          urls=[]
          service_nodes=[]
          def walk(v,path=''):
              if isinstance(v,dict):
                  if 'serviceBaseUrl' in v:
                      service_nodes.append((path,v))
                  for k,x in v.items():
                      walk(x,path+'.'+k if path else k)
              elif isinstance(v,list):
                  for i,x in enumerate(v): walk(x,f'{path}[{i}]')
              elif isinstance(v,str) and (v.startswith('http://') or v.startswith('https://')):
                  lp=path.lower()
                  if any(k in lp for k in ['service','content','catalog','search','cms','image','metadata','recommend','ues','epg','user']):
                      urls.append((path,v))
          walk(config)

          print('CONFIG_RESOLVED',True)
          for path,val in urls[:200]:
              print('SERVICE_URL',path,val)

          # Print service names and URL only; redact apiKey/ticket/security values.
          for path,node in service_nodes[:100]:
              safe={}
              for k,v in node.items():
                  lk=k.lower()
                  if any(x in lk for x in ['key','token','secret','security','authorization','ticket']):
                      safe[k]='<redacted>'
                  elif isinstance(v,(str,int,float,bool)) or v is None:
                      safe[k]=v
              print('SERVICE_NODE',path,json.dumps(safe,ensure_ascii=False))
          PY

      - name: Inspect D-Smart CMS call contract
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 40 \
            -A "Mozilla/5.0 NuvioCalendarDiagnostic/7.0" \
            https://www.dsmartgo.com.tr/main.js -o "$RUNNER_TEMP/main.js"

          python3 - "$RUNNER_TEMP/main.js" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8',errors='replace').read()

          def safe(x):
              # Hide public-client/API credential-looking literals while preserving
              # method names, relative paths and hosts.
              x=re.sub(r'([A-Za-z0-9._-]{28,})','<redacted>',x)
              return x.replace('\n',' ')

          needles=[
              'contentConfig.cms',
              'cms.serviceBaseUrl',
              'cms.apiKey',
              'GetContent',
              'getContent',
              'GetLanding',
              'getLanding',
              'GetPicker',
              'getPicker',
              'GetSearch',
              'getSearch',
              'GetDetail',
              'getDetail',
              'GetList',
              'getList',
              'cmsPackageItems'
          ]
          seen=set()
          for needle in needles:
              start=0
              count=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  # Only a few representative contexts per term.
                  if i not in seen:
                      print('\n### CMS_CONTEXT',needle,'AT',i)
                      print(safe(s[max(0,i-1400):i+2600])[:4400])
                      seen.add(i)
                      count+=1
                  start=i+len(needle)
                  if count>=8: break

          # Extract likely REST path literals from the whole bundle. These are not
          # credentials and are safe to print.
          paths=[]
          for m in re.finditer(r'["\x60\'](/[^"\x60\']{1,160})["\x60\']',s):
              p=m.group(1)
              lp=p.lower()
              if any(k in lp for k in [
                  'content','catalog','landing','picker','search','detail','asset',
                  'page','cms','package','movie','series','vod','carousel','list'
              ]):
                  if p not in paths:
                      paths.append(p)
          print('\n### CMS_PATH_CANDIDATES')
          for p in paths[:300]:
              print(safe(p))
          print('CMS_PATH_COUNT',len(paths))
          PY

      - name: Probe D-Smart CMS public API contract
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 40 \
            -A "Mozilla/5.0 NuvioCalendarDiagnostic/8.0" \
            https://www.dsmartgo.com.tr/main.js -o "$RUNNER_TEMP/main.js"

          python3 - "$RUNNER_TEMP/main.js" <<'PY'
          import json,re,subprocess,sys,time
          s=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          anchor=s.find('url:"/client/site-config"')
          region=s[max(0,anchor-2200):anchor+800]
          tokens=re.findall(r'["\']([A-Za-z0-9._-]{28,120})["\']',region)
          client=max(tokens,key=len) if tokens else None
          if not client: raise SystemExit('client credential not found')
          print('::add-mask::'+client)

          cfg='/tmp/dsmart-site-config.json'
          cmd=[
            'curl','-sS','--connect-timeout','10','--max-time','30',
            '-o',cfg,'-w','%{http_code}',
            '-H','Authorization: Bearer '+client,
            '-H','Accept: application/json',
            '--get','https://bfogwjgq8dbp.merlincdn.net/client/site-config',
            '--data-urlencode','version=1.0.5',
            '--data-urlencode','platform=web-desktop',
            '--data-urlencode','timestamp='+str(int(time.time()*1000))
          ]
          status=subprocess.run(cmd,text=True,capture_output=True).stdout.strip()
          print('CONFIG_HTTP',status)
          if status!='200': raise SystemExit(2)
          payload=json.load(open(cfg,encoding='utf-8'))

          # Locate the CMS node generically.
          cms=None
          def walk(v):
            global cms
            if isinstance(v,dict):
              if v.get('serviceBaseUrl')=='https://iwxa44sbbqmf.merlincdn.net' and isinstance(v.get('apiKey'),str):
                cms=v
                return
              for x in v.values():
                if cms is None: walk(x)
            elif isinstance(v,list):
              for x in v:
                if cms is None: walk(x)
          walk(payload)
          if not cms: raise SystemExit('cms node not found')
          key=cms['apiKey']
          print('CMS_API_KEY_FOUND',True,'LEN',len(key))
          print('::add-mask::'+key)
          base=cms['serviceBaseUrl'].rstrip('/')
          print('CMS_BASE',base,'TENANT',cms.get('tenantId'),'QUERY_PARAM',cms.get('queryParam'))

          header_forms=[
            ('none',[]),
            ('authorization-raw',['Authorization: '+key]),
            ('authorization-bearer',['Authorization: Bearer '+key]),
            ('x-api-key',['x-api-key: '+key]),
            ('api-key',['api-key: '+key]),
            ('apikey',['apikey: '+key]),
            ('apiKey',['apiKey: '+key]),
          ]
          probe_paths=[
            '/', '/health', '/healthcheck', '/swagger', '/swagger/index.html',
            '/swagger/v1/swagger.json', '/openapi.json', '/api-docs', '/docs',
            '/v1/swagger.json', '/swagger.json'
          ]

          successful=[]
          for label,headers in header_forms:
            for path in probe_paths:
              out='/tmp/dsmart-probe'
              cmd=['curl','-sS','--connect-timeout','6','--max-time','12','-o',out,'-w','%{http_code}',
                   '-H','Accept: application/json,text/html;q=0.9,*/*;q=0.8']
              for h in headers: cmd += ['-H',h]
              cmd += [base+path]
              p=subprocess.run(cmd,text=True,capture_output=True)
              code=p.stdout.strip()
              if code not in ('404','405','000'):
                size=0
                try: size=len(open(out,'rb').read())
                except: pass
                print('CMS_PROBE',label,path,'HTTP',code,'BYTES',size)
              if code=='200':
                successful.append((label,path,out))
                if 'swagger' in path or 'openapi' in path or 'api-docs' in path:
                  try:
                    doc=json.load(open(out,encoding='utf-8'))
                    paths=doc.get('paths',{}) if isinstance(doc,dict) else {}
                    print('OPENAPI_PATH_COUNT',len(paths))
                    for pth,methods in list(paths.items())[:300]:
                      print('OPENAPI_PATH',pth,','.join(methods.keys()) if isinstance(methods,dict) else '')
                  except Exception:
                    pass

          print('CMS_SUCCESSFUL_PROBES',[(a,b) for a,b,_ in successful])
          PY

      - name: Extract D-Smart CMS SDK module
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 40 \
            -A "Mozilla/5.0 NuvioCalendarDiagnostic/9.0" \
            https://www.dsmartgo.com.tr/main.js -o "$RUNNER_TEMP/main.js"

          python3 - "$RUNNER_TEMP/main.js" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8',errors='replace').read()

          def safe(x):
              x=re.sub(r'([A-Za-z0-9._-]{28,})','<redacted>',x)
              return x.replace('\n',' ')

          # Find modules that actually build an HTTP client from a CMS-style
          # config (serviceBaseUrl/apiKey/tenantId). Print only structural code.
          hits=[]
          for needle in ['tenantId','serviceBaseUrl','apiKey','queryParam']:
              start=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  window=s[max(0,i-4500):i+6500]
                  if 'serviceBaseUrl' in window and 'apiKey' in window:
                      hits.append(i)
                  start=i+len(needle)

          modules=[]
          seen=set()
          module_start_re=re.compile(r'(\d+):\(t,a,e\)=>\{')
          for i in hits:
              before=s[:i]
              starts=list(module_start_re.finditer(before[max(0,len(before)-120000):]))
              if starts:
                  base=max(0,i-120000)
                  m=starts[-1]
                  start=base+m.start()
                  module_id=m.group(1)
              else:
                  # fallback: bounded context
                  start=max(0,i-12000); module_id='context'
              if (module_id,start) in seen: continue
              seen.add((module_id,start))
              # webpack modules usually end before the next numeric module marker.
              nxt=re.search(r'\},\d+:\(t,a,e\)=>\{',s[i:])
              end=i+(nxt.start()+1 if nxt else 22000)
              end=min(len(s),max(i+8000,end))
              chunk=s[start:min(end,start+50000)]
              if 'serviceBaseUrl' not in chunk or 'apiKey' not in chunk: continue
              modules.append((module_id,start,chunk))

          print('CMS_MODULE_CANDIDATES',len(modules))
          for module_id,start,chunk in modules[:12]:
              print('\n### CMS_MODULE',module_id,'AT',start)
              # Extract method names and endpoint-like literal fragments first.
              methods=[]
              for m in re.finditer(r'(?:async\s+)?([A-Za-z_$][A-Za-z0-9_$]{2,80})\([^)]*\)\{',chunk):
                  name=m.group(1)
                  if name not in methods: methods.append(name)
              print('METHODS',methods[:160])
              candidates=[]
              for pat in [
                  r'["\x60\'](/[^"\x60\']{1,180})["\x60\']',
                  r'url\s*:\s*["\x60\']([^"\x60\']{1,180})["\x60\']',
                  r'\.get\(["\x60\']([^"\x60\']{1,180})["\x60\']',
                  r'\.post\(["\x60\']([^"\x60\']{1,180})["\x60\']'
              ]:
                  for pat in [pat]:
                      for m in re.finditer(pat,chunk):
                          val=m.group(1)
                          if val not in candidates: candidates.append(val)
              print('ENDPOINT_LITERALS', [safe(v) for v in candidates[:200]])
              print('MODULE_SNIPPET',safe(chunk[:30000]))
          PY

          # Check whether a source map is publicly available; if it is, its
          # original source names make endpoint discovery deterministic.
          code="$(curl -sS -o "$RUNNER_TEMP/main.js.map" -w '%{http_code}' --connect-timeout 8 --max-time 20 https://www.dsmartgo.com.tr/main.js.map || true)"
          echo "SOURCEMAP_HTTP=$code"
          if [[ "$code" == "200" ]]; then
            python3 - "$RUNNER_TEMP/main.js.map" <<'PY'
          import json,sys,re
          try:
              doc=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception:
              print('SOURCEMAP_JSON false'); raise SystemExit(0)
          sources=doc.get('sources',[])
          print('SOURCEMAP_JSON true SOURCES',len(sources))
          for i,name in enumerate(sources):
              low=str(name).lower()
              if any(k in low for k in ['cms','content','service','landing','picker']):
                  print('SOURCE',i,name)
          PY
          fi

      - name: Resolve and inspect D-Smart lazy CMS chunks
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 40 \
            -A "Mozilla/5.0 NuvioCalendarDiagnostic/10.0" \
            https://www.dsmartgo.com.tr/main.js -o "$RUNNER_TEMP/main.js"

          python3 - "$RUNNER_TEMP/main.js" "$RUNNER_TEMP" <<'PY'
          import os,re,subprocess,sys
          js_path,tmp=sys.argv[1:3]
          s=open(js_path,encoding='utf-8',errors='replace').read()

          def safe(x):
              return re.sub(r'([A-Za-z0-9._-]{28,})','<redacted>',x).replace('\n',' ')

          for needle in ['n.u=', '.u=', '761', '169']:
              i=s.find(needle)
              if i>=0:
                  print('\n### CHUNK_RUNTIME',needle,'AT',i)
                  print(safe(s[max(0,i-2200):i+6500])[:9000])

          # Extract chunk-id -> hash/name mappings from the runtime vicinity.
          runtime_idx=s.rfind('n.u=',0,max(s.find('n.e(761)'),0))
          if runtime_idx<0:
              runtime_idx=s.find('n.u=')
          runtime=s[runtime_idx:runtime_idx+30000] if runtime_idx>=0 else s[-90000:]
          print('RUNTIME_FOUND',runtime_idx>=0)

          candidates={}
          # Common webpack production forms: {169:"hash",761:"hash"}[t]
          for m in re.finditer(r'(169|761):["\']([^"\']{3,120})["\']',runtime):
              candidates.setdefault(m.group(1),[]).append(m.group(2))
          # Sometimes numeric keys are quoted.
          for m in re.finditer(r'["\'](169|761)["\']\s*:\s*["\']([^"\']{3,120})["\']',runtime):
              candidates.setdefault(m.group(1),[]).append(m.group(2))
          print('CHUNK_MAP', {k:[safe(x) for x in v] for k,v in candidates.items()})

          # Collect any literal JS filenames around the runtime.
          jsfiles=[]
          for m in re.finditer(r'["\']([^"\']+\.js)["\']',runtime):
              v=m.group(1)
              if v not in jsfiles: jsfiles.append(v)
          print('RUNTIME_JS_LITERALS',[safe(x) for x in jsfiles[:120]])

          # Build likely filenames from the exact runtime expression by finding
          # hash strings paired to IDs and testing standard webpack shapes.
          urls=[]
          for cid in ('761','169'):
              vals=candidates.get(cid,[])
              for val in vals:
                  guesses=[
                    f'{cid}.{val}.js',
                    f'{cid}.{val}.chunk.js',
                    f'static/js/{cid}.{val}.js',
                    f'static/js/{cid}.{val}.chunk.js',
                  ]
                  for g in guesses:
                      url='https://www.dsmartgo.com.tr/'+g
                      if url not in urls: urls.append(url)

          # Also parse direct concatenation patterns from n.u.
          print('CHUNK_URL_GUESSES',[safe(x) for x in urls])
          found=[]
          for idx,url in enumerate(urls):
              out=os.path.join(tmp,f'chunk-{idx}.js')
              p=subprocess.run(['curl','-sS','--connect-timeout','6','--max-time','18','-o',out,'-w','%{http_code}',url],text=True,capture_output=True)
              code=p.stdout.strip()
              if code=='200':
                  size=os.path.getsize(out)
                  # Reject HTML SPA fallback.
                  head=open(out,'rb').read(80).decode('utf-8','ignore').lower()
                  if '<!doctype html' not in head and size>1000:
                      print('CHUNK_FETCH_OK',safe(url),'BYTES',size)
                      found.append((url,out))

          print('CHUNKS_FOUND',len(found))
          for url,out in found:
              text=open(out,encoding='utf-8',errors='replace').read()
              print('\n### CHUNK_SCAN',safe(url))
              for needle in ['serviceBaseUrl','tenantId','apiKey','GetContent','getListData','dynamicQuery','CMS']:
                  start=0; shown=0
                  while True:
                      i=text.find(needle,start)
                      if i<0: break
                      print('CTX',needle,'AT',i,safe(text[max(0,i-1800):i+4200])[:6500])
                      shown+=1; start=i+len(needle)
                      if shown>=6: break
          PY
