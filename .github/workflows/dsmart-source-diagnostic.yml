name: D Smart Source Diagnostic
on:
  push:
    branches:
      - main
    paths:
      - ".github/dsmart-source-diagnostic-run"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect D-Smart GO bundle endpoints
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 40 \
            -A "Mozilla/5.0 NuvioCalendarDiagnostic/2.0" \
            https://www.dsmartgo.com.tr/main.js -o "$RUNNER_TEMP/main.js"
          python3 - "$RUNNER_TEMP/main.js" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          print("bytes",len(s))
          needles=[
            'baseURL','baseUrl','apiUrl','apiURL','serviceUrl','serviceURL','environment',
            'catalog','Catalogue','content','Content','vod','VOD','sec-izle','diziler',
            'filmler','carousel','recommendation','GetContent','getContent','search'
          ]
          seen=set()
          for needle in needles:
              start=0
              found=0
              while True:
                  i=s.lower().find(needle.lower(),start)
                  if i<0: break
                  chunk=s[max(0,i-450):i+1100]
                  key=chunk[:200]
                  if key not in seen:
                      seen.add(key); found+=1
                      print("\n### TERM",needle,"AT",i)
                      print(chunk.replace("\n"," ")[:1600])
                  start=i+len(needle)
                  if found>=8: break
          print("\n### HOSTS")
          hosts=[]
          for m in re.finditer(r'(?i)(?:https?:)?//([a-z0-9.-]+)(?::\d+)?(?:/[^"\'\\ ]*)?',s):
              host=m.group(1).lower()
              if host not in hosts: hosts.append(host)
          for h in hosts:
              if any(k in h for k in ['dsmart','merlin','api','ott','vod','content','cms']):
                  print(h)
          print("\n### API-LIKE STRING LITERALS")
          vals=[]
          for m in re.finditer(r'["\']([^"\']{4,260})["\']',s):
              v=m.group(1)
              lv=v.lower()
              if any(k in lv for k in ['api/','/api','catalog','content','vod','movie','film','dizi','search','carousel','recommend']) and (' ' not in v or '/' in v):
                  if v not in vals: vals.append(v)
          for v in vals[:500]: print(v)
          PY
