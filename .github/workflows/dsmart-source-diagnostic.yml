name: D Smart Source Diagnostic
on:
  push:
    branches:
      - main
    paths:
      - ".github/dsmart-source-diagnostic-run"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public D-Smart GO application
        shell: bash
        run: |
          set -Eeuo pipefail
          base="https://www.dsmartgo.com.tr"
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 \
            -A "Mozilla/5.0 NuvioCalendarDiagnostic/1.0" \
            "$base/tr/sec-izle/diziler" -o "$RUNNER_TEMP/dsmart.html"
          python3 - "$RUNNER_TEMP/dsmart.html" "$base" "$RUNNER_TEMP" <<'PY'
          import re,sys,html,subprocess,os
          page,base,tmp=sys.argv[1:]
          s=open(page,encoding='utf-8',errors='replace').read()
          print("page-bytes",len(s))
          print(s[:4000].replace("\n"," "))
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',s,re.I):
              src=html.unescape(src)
              if src.startswith('//'): src='https:'+src
              elif src.startswith('/'): src=base+src
              elif not src.startswith('http'): src=base+'/'+src
              scripts.append(src)
          print("scripts",len(scripts))
          for i,u in enumerate(scripts[:40]): print("SCRIPT",i,u)
          for i,u in enumerate(scripts[:25]):
              dest=os.path.join(tmp,f'chunk-{i}.js')
              try:
                  subprocess.run(['curl','-fsSL','--retry','2','--max-time','25','-A','Mozilla/5.0',u,'-o',dest],check=True)
              except Exception:
                  continue
              js=open(dest,encoding='utf-8',errors='replace').read()
              hits=[]
              for pat in [
                  r'https?://[^"\'\\ ]+',
                  r'["\'](/(?:api|web|content|catalog|movie|film|dizi|search|vod)[^"\']*)["\']'
              ]:
                  for m in re.finditer(pat,js,re.I):
                      val=m.group(0)
                      if any(k in val.lower() for k in ['api','web/','catalog','content','film','dizi','movie','vod','search']):
                          hits.append(val[:500])
              if hits:
                  print("\n### CHUNK",i,u,"bytes",len(js))
                  for h in list(dict.fromkeys(hits))[:120]: print(h)
          PY
