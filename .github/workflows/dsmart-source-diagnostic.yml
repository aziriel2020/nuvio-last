name: D Smart Source Diagnostic
on:
  push:
    branches:
      - main
    paths:
      - ".github/dsmart-source-diagnostic-run"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve D-Smart GO public service configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 40 \
            -A "Mozilla/5.0 NuvioCalendarDiagnostic/4.0" \
            https://www.dsmartgo.com.tr/main.js -o "$RUNNER_TEMP/main.js"
          python3 - "$RUNNER_TEMP/main.js" <<'PY'
          import re,sys,json,subprocess
          s=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          anchor=s.find('url:"/client/site-config"')
          assert anchor >= 0
          region=s[max(0,anchor-1800):anchor+600]

          # Find credential-looking public client literal only in the site-config code.
          tokens=re.findall(r'["\']([A-Za-z0-9._-]{28,120})["\']',region)
          token=max(tokens,key=len) if tokens else None
          print('PUBLIC_CLIENT_LITERAL_FOUND',bool(token),'LEN',len(token or ''))
          if token:
              print('::add-mask::'+token)

          site_key='com.dsmartgo.website.prod'
          forms=[]
          if token:
              forms=[
                ('raw', token),
                ('Bearer', 'Bearer '+token),
                ('bearer', 'bearer '+token),
                ('ApiKey', 'ApiKey '+token),
                ('Basic', 'Basic '+token),
              ]

          def extract_services(payload):
              data=payload.get('data',payload) if isinstance(payload,dict) else payload
              urls=[]
              def walk(v,path=''):
                  if isinstance(v,dict):
                      for k,x in v.items(): walk(x,path+'.'+k if path else k)
                  elif isinstance(v,list):
                      for i,x in enumerate(v): walk(x,f'{path}[{i}]')
                  elif isinstance(v,str) and (v.startswith('http://') or v.startswith('https://')):
                      lp=path.lower()
                      if any(k in lp for k in ['service','content','catalog','search','cms','image','metadata','recommend','ues','user','epg']):
                          urls.append((path,v))
              walk(data)
              return data,urls

          success=False
          for label,auth in forms:
              cmd=[
                'curl','-sS','--connect-timeout','10','--max-time','25',
                '-o','/tmp/dsmart-config.json','-w','%{http_code}',
                '-H','Authorization: '+auth,
                '-H','Accept: application/json',
                '--get','https://bfogwjgq8dbp.merlincdn.net/client/site-config',
                '--data-urlencode','key='+site_key,
                '--data-urlencode','version=1.0.5',
                '--data-urlencode','platform=web-desktop',
              ]
              p=subprocess.run(cmd,capture_output=True,text=True)
              status=p.stdout.strip()
              print('AUTH_FORM',label,'HTTP',status)
              if status != '200': continue
              try: payload=json.load(open('/tmp/dsmart-config.json',encoding='utf-8'))
              except Exception: continue
              data,urls=extract_services(payload)
              text=json.dumps(data,ensure_ascii=False)
              if 'servicesConfig' not in text and 'serviceBaseUrl' not in text:
                  print('HTTP200_BUT_NO_SERVICES',label)
                  continue
              print('CONFIG_KEY_OK',site_key,'AUTH_FORM',label)
              for path,val in urls[:180]:
                  print('SERVICE_URL',path,val)
              success=True
              break
          print('CONFIG_RESOLVED',success)
          PY
