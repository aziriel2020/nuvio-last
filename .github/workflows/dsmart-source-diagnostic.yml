name: D Smart Source Diagnostic
on:
  push:
    branches: [main]
    paths: [".github/dsmart-source-diagnostic-run"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find D-Smart site-config key
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 40 \
            -A "Mozilla/5.0 NuvioCalendarDiagnostic/5.0" \
            https://www.dsmartgo.com.tr/main.js -o "$RUNNER_TEMP/main.js"
          python3 - "$RUNNER_TEMP/main.js" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          def sanitize(x):
              x=re.sub(r'([A-Za-z0-9._-]{28,})','<token>',x)
              return x.replace('\n',' ')
          patterns=['.getConfig(', 'getConfig(', 'siteConfig=', 'siteConfig:', 'Config Version:', 'productAssetUrl']
          seen=set()
          for pat in patterns:
              print('\n###',pat)
              start=0; n=0
              while True:
                  i=s.find(pat,start)
                  if i<0: break
                  chunk=s[max(0,i-900):i+1800]
                  key=(i,pat)
                  if key not in seen:
                      print('AT',i,sanitize(chunk)[:3000])
                      seen.add(key); n+=1
                  start=i+len(pat)
                  if n>=20: break

          # Print short literal candidates near startup/config calls only.
          print('\n### STARTUP LITERALS')
          tail=s[-45000:]
          vals=[]
          for m in re.finditer(r'["\']([^"\']{2,120})["\']',tail):
              v=m.group(1)
              if any(k in v.lower() for k in ['dsmart','config','prod','website','site','platform']):
                  if v not in vals: vals.append(v)
          for v in vals[:120]:
              print(re.sub(r'[A-Za-z0-9._-]{28,}','<token>',v))
          PY
