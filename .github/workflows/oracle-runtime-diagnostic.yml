name: Oracle Runtime Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - ".github/oracle-runtime-diagnostic-trigger"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$RUNNER_TEMP/keys"
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          raw=os.environ["ORACLE_SSH_PRIVATE_KEY"].strip()
          vals=[raw]
          if len(raw)>=2 and raw[0]==raw[-1]=='"':
              try: vals.append(json.loads(raw))
              except Exception: pass
          out=[]
          for v in vals:
              out += [v, v.replace(chr(13),"").replace(chr(92)+"r","").replace(chr(92)+"n",chr(10))]
              try: out.append(base64.b64decode(v,validate=True).decode())
              except Exception: pass
          for v in out:
              v=v.replace(chr(13),"")
              for label in ["OPENSSH PRIVATE KEY","PRIVATE KEY","RSA PRIVATE KEY"]:
                  b="-----BEGIN "+label+"-----"; e="-----END "+label+"-----"
                  if b in v and e in v:
                      body="".join(v.split(b,1)[1].split(e,1)[0].split())
                      Path(os.environ["RUNNER_TEMP"]+"/keys/oracle_ssh.pem").write_text(b+"\n"+body+"\n"+e+"\n")
                      raise SystemExit(0)
          raise SystemExit("ORACLE_SSH_PRIVATE_KEY")
          PY
          chmod 600 "$RUNNER_TEMP/keys/oracle_ssh.pem"
          ssh-keygen -y -f "$RUNNER_TEMP/keys/oracle_ssh.pem" >/dev/null

      - name: Check live Oracle runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY="$RUNNER_TEMP/keys/oracle_ssh.pem"
          IP="141.145.215.202"
          HOST="141-145-215-202.sslip.io"
          ssh -i "$KEY" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 ubuntu@"$IP" "bash -s" <<'REMOTE'
          set -Eeuo pipefail
          echo "NUVIO_SERVICE=$(systemctl is-active nuvio || true)"
          echo "CADDY_SERVICE=$(systemctl is-active caddy || true)"
          echo "LOCAL_HEALTH:"
          curl -fsS --max-time 10 http://127.0.0.1:3000/_oracle/health || {
            echo "LOCAL_HEALTH_FAILED"
            sudo systemctl status nuvio --no-pager -l || true
            sudo journalctl -u nuvio -n 80 --no-pager || true
            exit 1
          }
          echo
          echo "PUBLIC_HEALTH:"
          curl -fsS --max-time 15 https://141-145-215-202.sslip.io/_oracle/health
          echo
          for p in /fr/manifest.json /global/manifest.json /tr/manifest.json /us/manifest.json /nuvio-collections-desktop.json /nuvio-collections-fr-global-tr-usa.json; do
            code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://141-145-215-202.sslip.io$p")"
            echo "$p $code"
            [[ "$code" == "200" ]]
          done
          REMOTE
