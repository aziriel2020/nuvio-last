name: Oracle Resume Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/oracle-turkiye-anime-verify-trigger"

permissions:
  contents: read
  actions: read

concurrency:
  group: oracle-nuvio-resume-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore existing Oracle Terraform state
        uses: actions/download-artifact@v4
        with:
          name: oracle-nuvio-provision-34347339416
          path: ${{ runner.temp }}/oracle-state
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34347339416

      - name: Resolve existing VM endpoint
        id: endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          state="$(find "$RUNNER_TEMP/oracle-state" -type f -name terraform.tfstate -print -quit)"
          [[ -n "$state" ]] || { echo "::error::terraform.tfstate missing"; exit 1; }
          ip="$(jq -r '.outputs.public_ip.value // empty' "$state")"
          host="${ip//./-}.nip.io"
          origin="https://$host"
          [[ -n "$ip" && -n "$host" && -n "$origin" ]] || { echo "::error::Oracle endpoint missing from state"; exit 1; }
          echo "::add-mask::$ip"
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"

      - name: Install SSH key
        shell: bash
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$RUNNER_TEMP/keys"
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          raw=os.environ["ORACLE_SSH_PRIVATE_KEY"].strip()
          vals=[raw]
          if len(raw)>=2 and raw[0]==raw[-1]=='"':
              try: vals.append(json.loads(raw))
              except Exception: pass
          for v in list(vals):
              vals.append(v.replace(chr(13),"").replace(chr(92)+"r","").replace(chr(92)+"n",chr(10)))
              try: vals.append(base64.b64decode(v,validate=True).decode())
              except Exception: pass
          for v in vals:
              v=v.replace(chr(13),"")
              for label in ("OPENSSH PRIVATE KEY","PRIVATE KEY","RSA PRIVATE KEY"):
                  b="-----BEGIN "+label+"-----"; e="-----END "+label+"-----"
                  if b in v and e in v:
                      body="".join(v.split(b,1)[1].split(e,1)[0].split())
                      if body:
                          Path(os.environ["RUNNER_TEMP"]+"/keys/oracle_ssh.pem").write_text(b+"\n"+body+"\n"+e+"\n")
                          raise SystemExit(0)
          raise SystemExit("ORACLE_SSH_PRIVATE_KEY")
          PY
          chmod 600 "$RUNNER_TEMP/keys/oracle_ssh.pem"
          ssh-keygen -y -f "$RUNNER_TEMP/keys/oracle_ssh.pem" >/dev/null
          echo "ORACLE_SSH_KEY=$RUNNER_TEMP/keys/oracle_ssh.pem" >> "$GITHUB_ENV"

      - name: Bootstrap current Nuvio on existing VM
        shell: bash
        env:
          PUBLIC_IP: ${{ steps.endpoint.outputs.ip }}
          PUBLIC_HOST: ${{ steps.endpoint.outputs.host }}
        run: |
          set -Eeuo pipefail
          ssh -i "$ORACLE_SSH_KEY" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 ubuntu@"$PUBLIC_IP" \
            "sudo PUBLIC_HOST='$PUBLIC_HOST' NUVIO_BRANCH=main bash -s" < oracle/bootstrap.sh

      - name: Verify local runtime over SSH
        shell: bash
        env:
          PUBLIC_IP: ${{ steps.endpoint.outputs.ip }}
          PUBLIC_HOST: ${{ steps.endpoint.outputs.host }}
        run: |
          set -Eeuo pipefail
          ssh -i "$ORACLE_SSH_KEY" -o StrictHostKeyChecking=accept-new ubuntu@"$PUBLIC_IP" \
            "bash -s -- '$PUBLIC_HOST'" <<'REMOTE'
          set -Eeuo pipefail
          host="$1"
          systemctl is-active --quiet nuvio
          systemctl is-active --quiet caddy
          curl -fsS --max-time 10 http://127.0.0.1:3000/_oracle/health |
            jq -e --arg origin "https://$host" '.ok == true and .runtime == "oracle-vm" and .publicOrigin == $origin'
          REMOTE

      - name: Ensure Caddy TLS certificate is ready
        shell: bash
        env:
          PUBLIC_IP: ${{ steps.endpoint.outputs.ip }}
          PUBLIC_HOST: ${{ steps.endpoint.outputs.host }}
        run: |
          set -Eeuo pipefail
          ssh -i "$ORACLE_SSH_KEY" -o StrictHostKeyChecking=accept-new ubuntu@"$PUBLIC_IP" \
            "sudo bash -s -- '$PUBLIC_HOST'" <<'REMOTE'
          set -Eeuo pipefail
          host="$1"
          systemctl restart caddy
          for attempt in {1..24}; do
            if timeout 8 openssl s_client -connect 127.0.0.1:443 -servername "$host" </dev/null 2>/dev/null |
               openssl x509 -noout -subject -issuer >/tmp/nuvio-cert.txt 2>/dev/null; then
              cat /tmp/nuvio-cert.txt
              exit 0
            fi
            sleep 5
          done
          echo "Caddy TLS certificate was not ready" >&2
          getent ahostsv4 "$host" || true
          ss -lntp | grep -E ':(80|443)\\b' || true
          journalctl -u caddy -n 160 --no-pager >&2 || true
          exit 1
          REMOTE

      - name: Verify public production endpoints
        shell: bash
        env:
          PUBLIC_IP: ${{ steps.endpoint.outputs.ip }}
          PUBLIC_HOST: ${{ steps.endpoint.outputs.host }}
          PUBLIC_ORIGIN: ${{ steps.endpoint.outputs.origin }}
        run: |
          set -Eeuo pipefail
          check_json() {
            local path="$1"
            echo "Checking $path"
            body="$(curl -fsS --resolve "$PUBLIC_HOST:443:$PUBLIC_IP" --retry 3 --retry-delay 1 --connect-timeout 5 --max-time 15 "$PUBLIC_ORIGIN$path")"
            printf '%s' "$body" | jq -e . >/dev/null
          }
          check_json /_oracle/health
          check_json /fr/manifest.json
          check_json /global/manifest.json
          check_json /tr/manifest.json
          check_json /us/manifest.json
          check_json /nuvio-collections-desktop.json
          check_json /nuvio-collections-fr-global-tr-usa.json

      - name: Critical catalog audit
        shell: bash
        env:
          PUBLIC_IP: ${{ steps.endpoint.outputs.ip }}
          PUBLIC_HOST: ${{ steps.endpoint.outputs.host }}
          PUBLIC_ORIGIN: ${{ steps.endpoint.outputs.origin }}
        run: |
          set -Eeuo pipefail

          curl_json() {
            curl -fsS --resolve "$PUBLIC_HOST:443:$PUBLIC_IP" \
              --connect-timeout 5 --max-time 20 "$PUBLIC_ORIGIN$1"
          }

          mkdir -p reports
          report="$RUNNER_TEMP/oracle-critical-audit.txt"
          : > "$report"
          anime_total=0
          catalogs_tested=0

          for region in fr global tr us; do
            echo "=== $region ===" | tee -a "$report"
            collections="$(curl_json "/$region/nuvio-collections.json")"
            printf '%s' "$collections" | jq -e . >/dev/null

            mapfile -t base_catalogs < <(
              printf '%s' "$collections" |
              jq -r '.. | objects | select(.catalogId? and .type?) | [.type,.catalogId] | @tsv' |
              awk '!seen[$0]++' | head -12
            )

            mapfile -t anime_catalogs < <(
              printf '%s' "$collections" |
              jq -r '.. | objects | select(.catalogId? and .type?) | select((tostring | test("anime|japan|japon|korea|coree|corée|korean|japanese|anilist|crunchy";"i"))) | [.type,.catalogId] | @tsv' |
              awk '!seen[$0]++' | head -12
            )

            declare -A chosen=()
            for row in "${anime_catalogs[@]}" "${base_catalogs[@]}"; do
              [[ -n "$row" ]] || continue
              chosen["$row"]=1
            done

            for row in "${!chosen[@]}"; do
              type="${row%%$'\t'*}"
              id="${row#*$'\t'}"
              encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$id")"
              body="$(curl_json "/$region/catalog/$type/$encoded.json")"
              printf '%s' "$body" | jq -e '.metas | type == "array"' >/dev/null
              count="$(printf '%s' "$body" | jq '.metas | length')"
              echo "$region $type $id metas=$count" | tee -a "$report"
              catalogs_tested=$((catalogs_tested + 1))
            done

            if (( ${#anime_catalogs[@]} > 0 )); then
              anime_total=$((anime_total + ${#anime_catalogs[@]}))
              echo "$region anime-candidates=${#anime_catalogs[@]}" | tee -a "$report"
            fi
            unset chosen
          done

          desktop="$(curl_json "/nuvio-collections-desktop.json")"
          combined="$(curl_json "/nuvio-collections-fr-global-tr-usa.json")"
          printf '%s' "$desktop" | jq -e . >/dev/null
          printf '%s' "$combined" | jq -e . >/dev/null

          desktop_bytes="$(printf '%s' "$desktop" | wc -c)"
          combined_bytes="$(printf '%s' "$combined" | wc -c)"
          echo "desktop-bytes=$desktop_bytes" | tee -a "$report"
          echo "combined-bytes=$combined_bytes" | tee -a "$report"
          echo "catalogs-tested=$catalogs_tested" | tee -a "$report"
          echo "anime-candidates=$anime_total" | tee -a "$report"

          bad_desktop_origins="$(
            printf '%s' "$desktop" |
            jq -r --arg origin "$PUBLIC_ORIGIN" '.. | strings | select(contains("/desktop-content-card.jpg")) | select(startswith($origin) | not)' |
            head -5
          )"
          [[ -z "$bad_desktop_origins" ]] || {
            echo "::error::Desktop card URLs are not using the active Oracle origin"
            printf '%s\n' "$bad_desktop_origins" >&2
            exit 1
          }

          health="$(curl_json "/_oracle/health")"
          printf '%s' "$health" | jq -e --arg origin "$PUBLIC_ORIGIN" '.ok == true and .runtime == "oracle-vm" and .publicOrigin == $origin' >/dev/null

          [[ "$desktop_bytes" -gt 100 ]] || { echo "::error::Desktop collections unexpectedly empty"; exit 1; }
          [[ "$combined_bytes" -gt 100 ]] || { echo "::error::Combined collections unexpectedly empty"; exit 1; }
          [[ "$catalogs_tested" -gt 0 ]] || { echo "::error::No catalogs were tested"; exit 1; }
          [[ "$anime_total" -gt 0 ]] || { echo "::error::No Anime/Japan/Korea catalog candidates found"; exit 1; }

          cp "$report" reports/oracle-critical-audit.txt

      - name: Verify Türkiye collections and Anime cinematic design
        shell: bash
        env:
          PUBLIC_IP: ${{ steps.endpoint.outputs.ip }}
          PUBLIC_HOST: ${{ steps.endpoint.outputs.host }}
          PUBLIC_ORIGIN: ${{ steps.endpoint.outputs.origin }}
        run: |
          set -Eeuo pipefail

          curl_json() {
            curl -fsS --resolve "$PUBLIC_HOST:443:$PUBLIC_IP" --connect-timeout 5 --max-time 30 "$PUBLIC_ORIGIN$1"
          }

          tr_collections="$(curl_json /tr/nuvio-collections.json)"
          printf '%s' "$tr_collections" | jq -e 'type == "array" and length == 18' >/dev/null
          printf '%s' "$tr_collections" | jq -e 'map(.title) | index("🇹🇷 Crunchyroll + AniList") != null' >/dev/null
          printf '%s' "$tr_collections" | jq -e 'map(.title) | index("🇹🇷 Max") != null' >/dev/null

          echo "Türkiye collections: $(printf '%s' "$tr_collections" | jq 'length')"

          # Every Türkiye folder must keep the rolling Today/Tomorrow sources and
          # both routes must return a valid metas[] payload (empty is legitimate).
          while IFS=
        shell: bash
        env:
          PUBLIC_ORIGIN: ${{ steps.endpoint.outputs.origin }}
        run: |
          {
            echo "## Oracle Resume Verify"
            echo
            echo "- Origin: $PUBLIC_ORIGIN"
            echo "- Health: $PUBLIC_ORIGIN/_oracle/health"
            echo "- France: $PUBLIC_ORIGIN/fr/manifest.json"
            echo "- Global: $PUBLIC_ORIGIN/global/manifest.json"
            echo "- Türkiye: $PUBLIC_ORIGIN/tr/manifest.json"
            echo "- USA: $PUBLIC_ORIGIN/us/manifest.json"
            echo "- Desktop: $PUBLIC_ORIGIN/nuvio-collections-desktop.json"
            echo "- Combined: $PUBLIC_ORIGIN/nuvio-collections-fr-global-tr-usa.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-resume-verify-${{ github.run_id }}
          path: |
            reports/oracle-resume-audit.json
            reports/oracle-critical-audit.txt
          if-no-files-found: warn
          retention-days: 30
\t' read -r title folder type today_id tomorrow_id; do
            [[ -n "$today_id" && -n "$tomorrow_id" ]]
            for id in "$today_id" "$tomorrow_id"; do
              encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$id")"
              body="$(curl_json "/tr/catalog/$type/$encoded.json")"
              printf '%s' "$body" | jq -e '.metas | type == "array"' >/dev/null
            done
            echo "TR OK: $title / $folder"
          done < <(
            printf '%s' "$tr_collections" |
            jq -r '.[] as $c | $c.folders[] | [$c.title,.title,.sources[0].type,.sources[0].catalogId,.sources[1].catalogId] | @tsv'
          )

          # Crunchyroll Türkiye folder artwork must render through the same
          # dedicated cinematic JPEG path used by the other Turkish services.
          crunchy_cover="$(
            printf '%s' "$tr_collections" |
            jq -r '.[] | select(.title=="🇹🇷 Crunchyroll + AniList") | .folders[0].coverImageUrl'
          )"
          [[ "$crunchy_cover" == "$PUBLIC_ORIGIN/tr/platform-category-card.svg"* || "$crunchy_cover" == "$PUBLIC_ORIGIN/tr/"* ]]
          desktop_collections="$(curl_json /nuvio-collections-desktop.json)"
          crunchy_desktop_cover="$(
            printf '%s' "$desktop_collections" |
            jq -r '.[] | select(.title=="🇹🇷 Crunchyroll + AniList") | .folders[0].coverImageUrl'
          )"
          [[ "$crunchy_desktop_cover" == "$PUBLIC_ORIGIN/tr/desktop-folder-card.jpg"* ]]
          crunchy_bytes="$(
            curl -fsS --resolve "$PUBLIC_HOST:443:$PUBLIC_IP" --connect-timeout 5 --max-time 30 "$crunchy_desktop_cover" | wc -c
          )"
          [[ "$crunchy_bytes" -gt 5000 ]]
          echo "Crunchyroll Türkiye cinematic cover bytes=$crunchy_bytes"

          # Find a real JP/KR Anime catalog with content, then ensure its Desktop
          # banner always uses the Shield cinematic renderer, including archive rows.
          global_collections="$(curl_json /global/nuvio-collections.json)"
          anime_series_sources="$(
            printf '%s' "$global_collections" |
            jq -r '.[] | select(.title=="🌍 Anime Japon + Corée") | .folders[] | select(.title=="Séries") | .sources[] | [.type,.catalogId] | @tsv'
          )"

          found=0
          checked=0
          while IFS=
        shell: bash
        env:
          PUBLIC_ORIGIN: ${{ steps.endpoint.outputs.origin }}
        run: |
          {
            echo "## Oracle Resume Verify"
            echo
            echo "- Origin: $PUBLIC_ORIGIN"
            echo "- Health: $PUBLIC_ORIGIN/_oracle/health"
            echo "- France: $PUBLIC_ORIGIN/fr/manifest.json"
            echo "- Global: $PUBLIC_ORIGIN/global/manifest.json"
            echo "- Türkiye: $PUBLIC_ORIGIN/tr/manifest.json"
            echo "- USA: $PUBLIC_ORIGIN/us/manifest.json"
            echo "- Desktop: $PUBLIC_ORIGIN/nuvio-collections-desktop.json"
            echo "- Combined: $PUBLIC_ORIGIN/nuvio-collections-fr-global-tr-usa.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-resume-verify-${{ github.run_id }}
          path: |
            reports/oracle-resume-audit.json
            reports/oracle-critical-audit.txt
          if-no-files-found: warn
          retention-days: 30
\t' read -r type id; do
            [[ -n "$id" ]] || continue
            checked=$((checked + 1))
            encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$id")"
            body="$(curl_json "/global/catalog/$type/$encoded.json")"
            count="$(printf '%s' "$body" | jq '.metas | length')"
            if [[ "$count" -gt 0 ]]; then
              banner="$(printf '%s' "$body" | jq -r '.metas[0].banner // empty')"
              [[ "$banner" == "$PUBLIC_ORIGIN/global/desktop-content-card.jpg"* ]]
              [[ "$banner" == *"provider=anime-asia"* ]]
              [[ "$banner" == *"design=shield3"* ]]
              banner_bytes="$(
                curl -fsS --resolve "$PUBLIC_HOST:443:$PUBLIC_IP" --connect-timeout 5 --max-time 30 "$banner" | wc -c
              )"
              [[ "$banner_bytes" -gt 5000 ]]
              echo "Anime cinematic OK: $id metas=$count bytes=$banner_bytes"
              found=1
              # Require at least one archive/month row when possible, not only Today.
              if [[ "$id" =~ -[0-9]{4}-[0-9]{2}$ ]]; then
                break
              fi
            fi
            [[ "$checked" -lt 30 ]] || break
          done <<< "$anime_series_sources"

          [[ "$found" == "1" ]] || { echo "::error::No live Anime catalog could validate the cinematic banner"; exit 1; }

      - name: Summary
        if: always()
        shell: bash
        env:
          PUBLIC_ORIGIN: ${{ steps.endpoint.outputs.origin }}
        run: |
          {
            echo "## Oracle Resume Verify"
            echo
            echo "- Origin: $PUBLIC_ORIGIN"
            echo "- Health: $PUBLIC_ORIGIN/_oracle/health"
            echo "- France: $PUBLIC_ORIGIN/fr/manifest.json"
            echo "- Global: $PUBLIC_ORIGIN/global/manifest.json"
            echo "- Türkiye: $PUBLIC_ORIGIN/tr/manifest.json"
            echo "- USA: $PUBLIC_ORIGIN/us/manifest.json"
            echo "- Desktop: $PUBLIC_ORIGIN/nuvio-collections-desktop.json"
            echo "- Combined: $PUBLIC_ORIGIN/nuvio-collections-fr-global-tr-usa.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-resume-verify-${{ github.run_id }}
          path: |
            reports/oracle-resume-audit.json
            reports/oracle-critical-audit.txt
          if-no-files-found: warn
          retention-days: 30
