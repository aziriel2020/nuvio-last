name: Temporary Finalize Desktop Oracle Main

on:
  push:
    branches: [migration/oracle-only-final]
    paths: [".github/workflows/tmp-finalize-desktop-oracle-main.yml"]

permissions:
  contents: write

jobs:
  clean-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/oracle-only-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove temporary and obsolete diagnostic workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/tmp-fix-desktop-jpeg.yml \
            .github/workflows/tmp-update-desktop-test.yml \
            .github/workflows/tmp-fix-desktop-jpeg-v2.yml \
            .github/workflows/tmp-harden-desktop-prod-audit.yml \
            .github/workflows/tmp-fix-desktop-prod-probe.yml \
            .github/workflows/tmp-oracle-branch-deploy.yml \
            .github/workflows/oracle-caddy-debug.yml \
            .github/workflows/oracle-runtime-diagnostic.yml \
            .github/workflows/oracle-resume-verify.yml \
            .github/workflows/oracle-turkiye-anime.yml \
            .github/workflows/dsmart-source-diagnostic.yml \
            .github/workflows/ssport-source-diagnostic.yml \
            .github/oracle-caddy-debug-trigger \
            .github/oracle-runtime-diagnostic-trigger \
            .github/oracle-turkiye-anime-verify-trigger

          # The one-shot finalizer removes itself from the resulting tree.
          git rm -f --ignore-unmatch .github/workflows/tmp-finalize-desktop-oracle-main.yml

          # No temporary workflow or trigger file may remain.
          if find .github -type f \( -name 'tmp-*' -o -name '*-trigger' \) -print -quit | grep -q .; then
            echo 'Temporary workflow/trigger remains:' >&2
            find .github -type f \( -name 'tmp-*' -o -name '*-trigger' \) -print >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run complete regression suite
        run: npm test

      - name: Run neutral runtime suite
        run: npm run test:runtime

      - name: Run Oracle integration suite
        run: npm run test:oracle

      - name: Validate final production workflows and repository
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check scripts/verify-oracle-production.mjs
          bash -n oracle/update.sh
          bash -n oracle/bootstrap.sh
          test -f .github/workflows/ci.yml
          test -f .github/workflows/deploy-oracle.yml
          test -f .github/workflows/audit-production.yml
          grep -q 'npm install --no-audit --no-fund' .github/workflows/deploy-oracle.yml
          grep -q 'npm install --no-audit --no-fund' .github/workflows/audit-production.yml
          grep -q 'desktop12-shield-jpeg' api/index.js
          grep -q 'shield-desktop-jpeg-v4' scripts/verify-oracle-production.mjs
          grep -q '1600x900' scripts/verify-oracle-production.mjs
          test ! -e .github/workflows/deploy-cloudflare.yml
          test ! -e wrangler.jsonc
          test ! -d cloudflare
          for f in regions/fr/vercel.json regions/global/vercel.json regions/tr/vercel.json regions/us/vercel.json; do test ! -e "$f"; done
          git diff --check

          echo 'Remaining legacy hosting tokens outside deny-list/tests/docs:'
          git grep -InE 'pages\.dev|workers\.dev|vercel\.app|sslip\.io|wrangler|cloudflare' -- \
            ':!test/**' ':!scripts/verify-oracle-production.mjs' ':!README*' ':!**/*.md' || true

      - name: Commit clean final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "cleanup: finalize Oracle-only Desktop production workflows"
          git push origin HEAD:migration/oracle-only-final
