name: Temporary Finalize Oracle-only Repository

on:
  push:
    branches:
      - migration/oracle-only-final
    paths:
      - ".github/workflows/tmp-finalize-oracle-repo.yml"

permissions:
  contents: write

jobs:
  cleanup-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/oracle-only-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove obsolete hosting machinery and migrate stale URLs
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          oracle = 'https://141-145-215-202.nip.io'

          test = Path('regions/global/test/anilist-resilience.test.js')
          text = test.read_text()
          text = text.replace("../../../cloudflare/anilist-resilience.mjs", "../../../runtime/anime-resilience.mjs")
          text = text.replace('Cloudflare resilience', 'Oracle runtime resilience')
          text = text.replace("response.headers.get('x-nuvio-origin'), 'cloudflare-only'", "response.headers.get('x-nuvio-origin'), 'oracle-vm'")
          test.write_text(text)

          url_re = re.compile(r'https://[^\s\"\'<>]+?(?:pages\.dev|workers\.dev|vercel\.app|sslip\.io)', re.I)
          for path in list(root.rglob('*.json')) + list(root.rglob('*.html')) + list(root.rglob('*.md')):
              if '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              try:
                  current = path.read_text()
              except UnicodeDecodeError:
                  continue
              updated = url_re.sub(oracle, current)
              if updated != current:
                  path.write_text(updated)

          for path in [Path('.gitignore'), *root.glob('regions/*/.gitignore')]:
              if not path.exists():
                  continue
              lines = path.read_text().splitlines()
              lines = [line for line in lines if '.vercel' not in line.lower()]
              path.write_text('\n'.join(lines).rstrip() + '\n')
          PY

          git rm -rf --ignore-unmatch \
            cloudflare \
            .github/workflows/deploy-cloudflare.yml \
            wrangler.jsonc \
            regions/fr/vercel.json \
            regions/global/vercel.json \
            regions/tr/vercel.json \
            regions/us/vercel.json \
            scripts/build-cloudflare-worker.js \
            scripts/build-cloudflare.js \
            scripts/configure-cloudflare-pages.mjs \
            scripts/diagnose-cloudflare.mjs \
            test/cloudflare.test.js \
            scripts/migrate-oracle-runtime.mjs \
            .github/workflows/tmp-oracle-runtime-migration.yml \
            .github/workflows/tmp-repo-legacy-scan.yml \
            .github/workflows/tmp-fix-anime-encoded-meta.yml

          git rm -f --ignore-unmatch .github/workflows/tmp-finalize-oracle-repo.yml

          echo '=== obsolete deployment files remaining ==='
          for f in wrangler.jsonc regions/fr/vercel.json regions/global/vercel.json regions/tr/vercel.json regions/us/vercel.json .github/workflows/deploy-cloudflare.yml; do
            test ! -e "$f"
          done
          test ! -d cloudflare

          echo '=== remaining legacy tokens (informational; deny-lists/tests may remain) ==='
          git grep -InE 'pages\.dev|workers\.dev|vercel\.app|sslip\.io|wrangler|cloudflare' -- . \
            ':(exclude)*.zip' ':(exclude)*.jpg' ':(exclude)*.jpeg' ':(exclude)*.png' ':(exclude)*.webp' || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run full business tests after cleanup
        run: npm test

      - name: Run neutral runtime tests after cleanup
        run: npm run test:runtime

      - name: Run Oracle integration after cleanup
        run: npm run test:oracle

      - name: Validate final Oracle-only deployment surface
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n oracle/bootstrap.sh
          bash -n oracle/update.sh
          node --check scripts/verify-oracle-production.mjs
          node -e "const p=require('./package.json'); for (const k of Object.keys(p.scripts||{})) if (/cloudflare|vercel|wrangler/i.test(k+' '+p.scripts[k])) throw new Error('legacy package script '+k);"
          test -f .github/workflows/deploy-oracle.yml
          test -f .github/workflows/audit-production.yml
          ! git grep -IlE 'pages\.dev|workers\.dev|vercel\.app|sslip\.io' -- '*.json' '*.html' '*.md'
          git diff --check

      - name: Commit final Oracle-only cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "cleanup: remove legacy Cloudflare and Vercel deployment surface"
          git push origin HEAD:migration/oracle-only-final
