name: S Sport Source Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect official S Sport schedule HTML
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 \
            -A "Mozilla/5.0 NuvioCalendarDiagnostic/1.0" \
            https://www.ssportplus.com/yayin-akisi/ -o "$RUNNER_TEMP/ssport.html"
          python3 - "$RUNNER_TEMP/ssport.html" <<'PY'
          import re,sys
          p=sys.argv[1]
          s=open(p,encoding='utf-8',errors='replace').read()
          print("bytes",len(s))
          for needle in ["Bugün 9 Eylül","Yarın 10 Eylül","Porto Riko","Seattle Seahawks","S Sport Plus"]:
              i=s.lower().find(needle.lower())
              print("\n###",needle,"index",i)
              if i>=0:
                  print(s[max(0,i-1800):i+2800].replace("\n"," ")[:5000])
          print("\n### candidate date/tab attributes")
          for m in re.finditer(r'(?i)(?:data-[a-z0-9_-]+|id|class)=["\'][^"\']*(?:9.?eyl|10.?eyl|tab|schedule|yayin|program|date)[^"\']*["\']',s):
              print(m.group(0)[:500])
          PY
