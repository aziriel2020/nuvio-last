name: Apply cinema deployment
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-cinema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply validated cinema patch
        shell: bash
        run: |
          set -Eeuo pipefail
          base64 -d > /tmp/cinema.patch <<'PATCH_B64'

PATCH_B64
          git apply --index /tmp/cinema.patch
          git rm .github/workflows/codex-deploy-cinema.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add Torrentio-filtered cinema collection"
          git push origin main
