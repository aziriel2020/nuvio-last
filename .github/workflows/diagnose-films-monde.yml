name: Diagnose Films Monde Live
on:
  pull_request:
    paths:
      - scripts/diagnose-films-monde-production.mjs
      - .github/workflows/diagnose-films-monde.yml
      - regions/movies/**
      - runtime/native-bridge.cjs
      - api/index.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  films-world:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query actual Oracle Films Monde index, manifests, and CDN artwork URLs
        run: node scripts/diagnose-films-monde-production.mjs
