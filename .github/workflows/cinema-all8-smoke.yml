name: Cinema All 8 Production Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/cinema-all8-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe all Cinema buckets
        shell: bash
        run: |
          set -uo pipefail
          BASE="https://141-145-215-202.nip.io"
          echo "HEALTH=$(curl -k -sS -L --connect-timeout 8 --max-time 15 "$BASE/_oracle/health" || true)"
          for KEY in nowplaying recent today yesterday thisweek lastweek thismonth previousmonth nextweek nextmonth
          do
            URL="$BASE/fr/catalog/movie/cinema-torrentio-$KEY.json?probe=all8"
            HDR="$(mktemp)"
            OUT="$(mktemp)"
            CODE="$(curl -k -sS -L --connect-timeout 8 --max-time 25 -D "$HDR" -o "$OUT" -w '%{http_code}' "$URL" || true)"
            TOTAL="$(jq -r 'if (.metas|type)=="array" then (.metas|length) else -1 end' "$OUT" 2>/dev/null || echo -1)"
            CAND="$(grep -i '^x-nuvio-cinema-candidates:' "$HDR" | tail -1 | tr -d '\r' | awk '{print $2}')"
            SCAN="$(grep -i '^x-nuvio-cinema-scanned:' "$HDR" | tail -1 | tr -d '\r' | awk '{print $2}')"
            NOTOR="$(grep -i '^x-nuvio-cinema-no-torrentio:' "$HDR" | tail -1 | tr -d '\r' | awk '{print $2}')"
            NOIMDB="$(grep -i '^x-nuvio-cinema-no-imdb:' "$HDR" | tail -1 | tr -d '\r' | awk '{print $2}')"
            BUDGET="$(grep -i '^x-nuvio-cinema-budget-exceeded:' "$HDR" | tail -1 | tr -d '\r' | awk '{print $2}')"
            EMPTY="$(grep -i '^x-nuvio-cinema-torrentio-empty:' "$HDR" | tail -1 | tr -d '\r' | awk '{print $2}')"
            HTTP403="$(grep -i '^x-nuvio-cinema-torrentio-403:' "$HDR" | tail -1 | tr -d '\r' | awk '{print $2}')"
            HTTP429="$(grep -i '^x-nuvio-cinema-torrentio-429:' "$HDR" | tail -1 | tr -d '\r' | awk '{print $2}')"
            HTTPOTHER="$(grep -i '^x-nuvio-cinema-torrentio-http-other:' "$HDR" | tail -1 | tr -d '\r' | awk '{print $2}')"
            TIMEOUT="$(grep -i '^x-nuvio-cinema-torrentio-timeout:' "$HDR" | tail -1 | tr -d '\r' | awk '{print $2}')"
            NETWORK="$(grep -i '^x-nuvio-cinema-torrentio-network:' "$HDR" | tail -1 | tr -d '\r' | awk '{print $2}')"
            echo "BUCKET=$KEY HTTP=$CODE METAS=$TOTAL CANDIDATES=${CAND:-na} SCANNED=${SCAN:-na} NO_TORRENTIO=${NOTOR:-na} EMPTY=${EMPTY:-na} HTTP403=${HTTP403:-na} HTTP429=${HTTP429:-na} HTTPOTHER=${HTTPOTHER:-na} TIMEOUT=${TIMEOUT:-na} NETWORK=${NETWORK:-na} NO_IMDB=${NOIMDB:-na} BUDGET=${BUDGET:-na}"
            if [ "$TOTAL" != "0" ] && [ "$TOTAL" != "-1" ]; then
              jq -r '.metas[] | [.name,.id,.released] | @tsv' "$OUT" | head -10
            fi
            rm -f "$HDR" "$OUT"
          done
          for FILE in nuvio-collections-shield.json nuvio-collections-desktop.json
          do
            OUT="$(mktemp)"
            CODE="$(curl -k -sS -L --connect-timeout 8 --max-time 25 -o "$OUT" -w '%{http_code}' "$BASE/$FILE?probe=labels-safe-covers")"
            echo "EDITORIAL_FILE=$FILE HTTP=$CODE"
            jq -c '[.[] | select(.id=="calendar-archives-fr-editorial-now")][0] // null | {id,title,folders:[.folders[]? | {id,title,coverImageUrl,sources:[.sources[]? | {catalogId,type,genre}]}]}' "$OUT"
            LABELS="$(jq -r '[.[] | select(.id=="calendar-archives-fr-editorial-now")][0] | [.folders[0].sources[].genre,.folders[1].sources[].genre,.folders[2].sources[].genre] | @tsv' "$OUT")"
            echo "SOURCE_LABELS=$LABELS"
            jq -r '[.[] | select(.id=="calendar-archives-fr-editorial-now")][0].folders[]?.coverImageUrl' "$OUT" | while read -r COVER
            do
              [ -z "$COVER" ] && continue
              CTYPE="$(curl -k -sS -L --connect-timeout 8 --max-time 25 -o /dev/null -w '%{http_code} %{content_type}' "$COVER")"
              echo "COVER=$CTYPE URL=$COVER"
            done
            rm -f "$OUT"
          done

          echo "MANIFEST_NAMES=$(curl -k -fsSL --connect-timeout 8 --max-time 25 "$BASE/fr/manifest.json?probe=labels" | jq -c '[.catalogs[] | select(.id|startswith("editorial-")) | {id,name}]')"

          for FILE in nuvio-collections-shield.json nuvio-collections-desktop.json
          do
            OUT="$(mktemp)"
            CODE="$(curl -k -sS -L --connect-timeout 8 --max-time 25 -o "$OUT" -w '%{http_code}' "$BASE/$FILE?probe=final")"
            echo -n "COLLECTION_FILE=$FILE HTTP=$CODE CINEMA="
            jq -c '[.[] | select(.id=="cinema-now-torrentio")][0] // null | if .==null then null else {id,title,folders:[.folders[]? | {id,title,catalogId:(.sources[0].catalogId // null)}]} end' "$OUT"
            rm -f "$OUT"
          done
