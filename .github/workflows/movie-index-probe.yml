name: Diagnose Films Monde discovery
on:
  push:
    branches: [fix/movies-discovery]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PUBLIC_IP: 141.145.215.202
    steps:
      - name: Install Oracle SSH key
        shell: bash
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$RUNNER_TEMP/keys"
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          raw=os.environ["ORACLE_SSH_PRIVATE_KEY"].strip()
          vals=[raw]
          if len(raw)>=2 and raw[0]==raw[-1]=='"':
              try: vals.append(json.loads(raw))
              except Exception: pass
          for v in list(vals):
              vals.append(v.replace(chr(13),"").replace(chr(92)+"r","").replace(chr(92)+"n",chr(10)))
              try: vals.append(base64.b64decode(v,validate=True).decode())
              except Exception: pass
          for v in vals:
              v=v.replace(chr(13),"")
              for label in ("OPENSSH PRIVATE KEY","PRIVATE KEY","RSA PRIVATE KEY"):
                  b="-----BEGIN "+label+"-----"; e="-----END "+label+"-----"
                  if b in v and e in v:
                      body="".join(v.split(b,1)[1].split(e,1)[0].split())
                      if body:
                          p=Path(os.environ["RUNNER_TEMP"]+"/keys/oracle_ssh.pem")
                          p.write_text(b+"\n"+body+"\n"+e+"\n")
                          raise SystemExit(0)
          raise SystemExit("ORACLE_SSH_PRIVATE_KEY is not a usable private key")
          PY
          chmod 600 "$RUNNER_TEMP/keys/oracle_ssh.pem"
          ssh-keygen -y -f "$RUNNER_TEMP/keys/oracle_ssh.pem" >/dev/null
          echo "ORACLE_SSH_KEY=$RUNNER_TEMP/keys/oracle_ssh.pem" >> "$GITHUB_ENV"

      - name: Check actual TMDB date filters without exposing credentials
        shell: bash
        run: |
          ssh -i "$ORACLE_SSH_KEY" -o StrictHostKeyChecking=accept-new ubuntu@"$PUBLIC_IP" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          systemctl stop nuvio-movies-sync.service
          cd /opt/nuvio/current
          set -a
          source /etc/nuvio/nuvio.env
          set +a
          node <<'NODE'
          const {tmdb}=require('./regions/series/src/upstream.cjs');
          (async()=>{
          const base={without_genres:16,include_adult:false,watch_region:'FR',with_watch_monetization_types:'flatrate|free|ads',sort_by:'primary_release_date.desc'};
          const probes=[{}, {'primary_release_date.lte':'1850-12-31'}, {'primary_release_date.gte':'2026-01-01','primary_release_date.lte':'2026-12-31'}, {'primary_release_date.gte':'0001-01-01','primary_release_date.lte':'0001-01-01'}, {'primary_release_date.gte':'1900-01-01','primary_release_date.lte':'1900-12-31'}, {'primary_release_date.lte':'1800-01-01'}, {'primary_release_year':1900}, {'with_watch_providers':'8','primary_release_date.gte':'2026-01-01','primary_release_date.lte':'2026-12-31'}];
          for(const params of probes){const p=await tmdb('/discover/movie',{...base,...params}); console.log(JSON.stringify({params,pages:p.total_pages,total:p.total_results,first:p.results?.slice(0,3).map(r=>({id:r.id,title:r.title,date:r.release_date}))}));}
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
          REMOTE
