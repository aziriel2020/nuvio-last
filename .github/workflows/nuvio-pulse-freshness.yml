name: Nuvio Pulse - France and Global Freshness

on:
  schedule:
    - cron: '25 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuvio-pulse-freshness
  cancel-in-progress: true

jobs:
  verify-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit Films Monde and Series V2 freshness plus all Pulse sources
        env:
          PUBLIC_ORIGIN: https://141-145-215-202.nip.io
        run: node scripts/verify-nuvio-pulse-production.mjs
