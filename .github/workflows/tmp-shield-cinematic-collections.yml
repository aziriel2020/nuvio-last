name: Temporary Shield Cinematic Collections Patch

on:
  push:
    branches:
      - fix/shield-cinematic-collections-v1

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shield-cinematic-collections-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Shield cinematic patch
        run: python3 scripts/tmp_patch_shield.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run full regression suite
        run: npm test
      - name: Test neutral runtime
        run: npm run test:runtime
      - name: Test Oracle integration
        run: npm run test:oracle
      - name: Validate production verifier syntax
        run: node --check scripts/verify-oracle-production.mjs
      - name: Commit verified Shield patch
        shell: bash
        run: |
          rm -f .github/workflows/tmp-shield-cinematic-collections.yml scripts/tmp_patch_shield.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add native cinematic Shield collection artwork'
          git push origin HEAD:fix/shield-cinematic-collections-v1
