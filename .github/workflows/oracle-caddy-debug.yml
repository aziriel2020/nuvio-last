name: Oracle Caddy Debug

on:
  push:
    branches:
      - main
    paths:
      - ".github/oracle-caddy-debug-trigger"

permissions:
  contents: read
  actions: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Restore Oracle state
        uses: actions/download-artifact@v4
        with:
          name: oracle-nuvio-provision-34347339416
          path: ${{ runner.temp }}/oracle-state
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34347339416

      - name: Resolve endpoint
        id: endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          state="$(find "$RUNNER_TEMP/oracle-state" -type f -name terraform.tfstate -print -quit)"
          ip="$(jq -r '.outputs.public_ip.value' "$state")"
          host="$(jq -r '.outputs.public_host.value' "$state")"
          echo "::add-mask::$ip"
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Install SSH key
        shell: bash
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$RUNNER_TEMP/keys"
          python3 - <<'PY'
          import base64,json,os
          from pathlib import Path
          raw=os.environ["ORACLE_SSH_PRIVATE_KEY"].strip()
          vals=[raw,raw.replace(chr(92)+"n",chr(10))]
          try: vals.append(base64.b64decode(raw,validate=True).decode())
          except Exception: pass
          for v in vals:
            for label in ("OPENSSH PRIVATE KEY","PRIVATE KEY","RSA PRIVATE KEY"):
              b="-----BEGIN "+label+"-----"; e="-----END "+label+"-----"
              if b in v and e in v:
                body="".join(v.split(b,1)[1].split(e,1)[0].split())
                Path(os.environ["RUNNER_TEMP"]+"/keys/key").write_text(b+"\n"+body+"\n"+e+"\n")
                raise SystemExit(0)
          raise SystemExit(1)
          PY
          chmod 600 "$RUNNER_TEMP/keys/key"

      - name: Dump Caddy TLS state
        shell: bash
        env:
          PUBLIC_IP: ${{ steps.endpoint.outputs.ip }}
          PUBLIC_HOST: ${{ steps.endpoint.outputs.host }}
        run: |
          set -Eeuo pipefail
          ssh -i "$RUNNER_TEMP/keys/key" -o StrictHostKeyChecking=accept-new ubuntu@"$PUBLIC_IP" \
            "sudo bash -s -- '$PUBLIC_HOST'" <<'REMOTE'
          set -u
          host="$1"
          echo "=== sockets ==="
          ss -lntp | grep -E ':(80|443)\\b' || true
          echo "=== caddy status ==="
          systemctl --no-pager --full status caddy || true
          echo "=== caddy journal ==="
          journalctl -u caddy --since "20 minutes ago" --no-pager || true
          echo "=== cert files ==="
          find /var/lib/caddy -type f 2>/dev/null | grep -E 'certificates|acme' | tail -80 || true
          echo "=== local TLS ==="
          curl -vk --resolve "$host:443:127.0.0.1" --connect-timeout 5 --max-time 12 "https://$host/_oracle/health" -o /tmp/debug-health 2>&1 || true
          cat /tmp/debug-health 2>/dev/null || true
          REMOTE
