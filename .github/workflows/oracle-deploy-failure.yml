name: Oracle Deploy Failure Inspector

on:
  pull_request:
    paths:
      - ".github/workflows/oracle-deploy-failure.yml"

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect latest main deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow "Deploy Oracle Production" --branch main --limit 5 --json databaseId,headSha,status,conclusion,createdAt,displayTitle
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Deploy Oracle Production" --branch main --limit 10 --json databaseId,headSha --jq '.[] | select(.headSha=="f4d187f8b43211b5384841b9b7be46937d60106e") | .databaseId' | head -1)"
          echo "TARGET_RUN=$RUN_ID"
          if [ -n "$RUN_ID" ]; then
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion,jobs
            echo "=== FAILED LOG ==="
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed || true
          fi
