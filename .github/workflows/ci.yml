name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run test suite
        run: npm test

      - name: Build and test free Cloudflare edge
        env:
          PUBLIC_ORIGIN: https://nuvio-edge-test.example
        run: npm run test:cloudflare

      - name: Build portable runtime assets
        env:
          PUBLIC_ORIGIN: http://127.0.0.1:3317
        run: npm run build:cloudflare

      - name: Test Oracle VM runtime
        run: npm run test:oracle

      - name: Validate Oracle shell scripts
        run: |
          bash -n oracle/bootstrap.sh
          bash -n oracle/update.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: Validate Oracle Always Free Terraform
        run: |
          terraform -chdir=oracle/terraform fmt -check -recursive
          terraform -chdir=oracle/terraform init -backend=false
          terraform -chdir=oracle/terraform validate
