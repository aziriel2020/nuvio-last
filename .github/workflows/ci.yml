name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run full test suite
        run: npm test

      - name: Validate generated-cover pipeline syntax
        run: node --check scripts/generate-platform-covers.js

      - name: Generate and validate approved-board exact cover set
        run: |
          rm -rf assets/generated-covers
          NUVIO_FORCE_COVER_REGEN=1 npm run generate:covers
          node - <<'NODE'
          const fs = require('fs');
          const sharp = require('sharp');
          (async () => {
            const manifest = JSON.parse(fs.readFileSync('assets/generated-covers/manifest.json', 'utf8'));
            if (manifest.revision !== 'generated-v5-approved-board-exact') throw new Error('unexpected cover revision');
            if (manifest.artDirection !== 'approved-board-exact-v5') throw new Error('unexpected art direction');
            if (manifest.backgroundPolicy?.tmdbBackdropDependency !== false) throw new Error('TMDb background dependency leaked');
            if (manifest.backgroundPolicy?.moodMixing !== false) throw new Error('mood mixing leaked');
            if (manifest.backgroundPolicy?.secondaryCompositing !== false) throw new Error('secondary compositing leaked');
            if (manifest.backgroundPolicy?.hueMutation !== false) throw new Error('hue mutation leaked');
            if (manifest.backgroundPolicy?.horizontalMirroring !== false) throw new Error('mirroring leaked');
            if (manifest.backgroundPolicy?.exactApprovedCardSource !== true) throw new Error('approved-card source policy missing');
            if (!Array.isArray(manifest.approvedCardFallbacks) || manifest.approvedCardFallbacks.length !== 0) throw new Error('approved-card fallback detected: ' + JSON.stringify(manifest.approvedCardFallbacks));
            for (const item of manifest.results || []) {
              if (item.sourceMode !== 'approved-board-exact' || item.sourceKind !== 'approved-card' || !String(item.sourceFile || '').endsWith('-card.jpg')) {
                throw new Error('service escaped approved card source: ' + JSON.stringify(item));
              }
            }
            for (const item of manifest.genres || []) {
              if (item.sourceMode !== 'approved-board-exact' || item.sourceKind !== 'approved-card' || !String(item.sourceFile || '').endsWith('-card.jpg')) {
                throw new Error('genre escaped approved card source: ' + JSON.stringify(item));
              }
            }
            if (Number(manifest.platformParents || 0) < 40) throw new Error('too few service identities');
            if (Number(manifest.genreIdentities || 0) < 20) throw new Error('too few genre identities');
            const sample = 'assets/generated-covers/fr/netflix/series-shield.jpg';
            const meta = await sharp(sample).metadata();
            if (meta.format !== 'jpeg' || meta.width !== 1600 || meta.height !== 900) {
              throw new Error(`bad sample cover: ${meta.format} ${meta.width}x${meta.height}`);
            }
            console.log(JSON.stringify({
              revision: manifest.revision,
              generatedFiles: manifest.generatedFiles,
              platformParents: manifest.platformParents,
              genreIdentities: manifest.genreIdentities,
              sample: `${meta.width}x${meta.height}`
            }));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Test neutral runtime layer
        run: npm run test:runtime

      - name: Test Oracle VM integration
        run: npm run test:oracle

      - name: Build final Oracle-compatible runtime assets
        env:
          PUBLIC_ORIGIN: https://141-145-215-202.nip.io
          NUVIO_RUNTIME: oracle-vm
        run: npm run build:runtime

      - name: Validate Oracle shell scripts
        run: |
          bash -n oracle/bootstrap.sh
          bash -n oracle/update.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: Validate Oracle Always Free Terraform
        run: |
          terraform -chdir=oracle/terraform fmt -check -diff -recursive
          terraform -chdir=oracle/terraform init -backend=false
          terraform -chdir=oracle/terraform validate
