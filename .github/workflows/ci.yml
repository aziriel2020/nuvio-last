name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run full test suite
        run: npm test

      - name: Validate generated-cover pipeline syntax
        run: node --check scripts/generate-platform-covers.js

      - name: Generate and validate HQ individual-master cover set
        run: |
          rm -rf assets/generated-covers
          NUVIO_FORCE_COVER_REGEN=1 npm run generate:covers
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');
          const crypto = require('crypto');

          (async () => {
            const manifest = JSON.parse(fs.readFileSync('assets/generated-covers/manifest.json', 'utf8'));
            if (manifest.revision !== 'generated-v8-individual-masters-hq') throw new Error('unexpected cover revision: ' + manifest.revision);
            if (manifest.artDirection !== 'individual-masters-hq-v8') throw new Error('unexpected art direction: ' + manifest.artDirection);
            if (manifest.visualReference !== 'validated-individual-lots-1-4') throw new Error('individual visual reference missing');

            const source = manifest.masterSource || {};
            if (source.sourceFile !== 'assets/individual-masters-v8/pack.b64.*') throw new Error('wrong v8 master source');
            if (source.indexFile !== 'assets/individual-masters-v8/index.json') throw new Error('wrong v8 master index');
            if (source.sha256 !== '19724311e5aa02db932c0caa88eb6d8bdbf3c6de8f2f5b42146d41803f18e352') throw new Error('wrong v8 pack sha256');
            if (Number(source.entryCount) !== 38 || Number(source.platformCount) !== 20 || Number(source.genreCount) !== 18) throw new Error('wrong v8 pack coverage');
            if (Number(source.width) !== 1600 || Number(source.height) !== 900 || source.ratio !== '16:9') throw new Error('wrong v8 master dimensions');
            if (Number(source.chunkCount) !== 19) throw new Error('wrong v8 pack chunk count');

            const index = JSON.parse(fs.readFileSync('assets/individual-masters-v8/index.json', 'utf8'));
            const chunks = fs.readdirSync('assets/individual-masters-v8').filter((name) => /^pack\.b64\.\d+$/.test(name)).sort();
            const packed = Buffer.from(chunks.map((name) => fs.readFileSync(path.join('assets/individual-masters-v8', name), 'utf8')).join('').replace(/\s+/g, ''), 'base64');
            const packSha = crypto.createHash('sha256').update(packed).digest('hex');
            if (packSha !== index.packSha256 || packSha !== source.sha256) throw new Error('v8 packed binary digest mismatch');

            for (const entry of index.entries || []) {
              const data = packed.subarray(Number(entry.offset), Number(entry.offset) + Number(entry.length));
              const digest = crypto.createHash('sha256').update(data).digest('hex');
              if (digest !== entry.sha256) throw new Error('entry digest mismatch: ' + entry.kind + '/' + entry.key);
              const meta = await sharp(data).metadata();
              if (meta.width !== 1600 || meta.height !== 900) throw new Error('entry is not 1600x900 landscape: ' + entry.kind + '/' + entry.key);
            }

            if (manifest.backgroundPolicy?.tmdbBackdropDependency !== false) throw new Error('TMDb background dependency leaked');
            if (manifest.backgroundPolicy?.individualMastersArePrimary !== true) throw new Error('individual masters are not primary');
            if (manifest.backgroundPolicy?.fullFramePreserved !== true) throw new Error('full-frame preservation missing');
            if (manifest.backgroundPolicy?.heroCropMode !== 'none-contain-black-ui-blend') throw new Error('hero crop policy invalid');
            if (manifest.designProfile?.shield?.width !== 1600 || manifest.designProfile?.shield?.height !== 900 || manifest.designProfile?.shield?.fit !== 'contain' || manifest.designProfile?.shield?.crop !== false) throw new Error('Shield landscape profile invalid');
            if (manifest.designProfile?.desktop?.width !== 1600 || manifest.designProfile?.desktop?.height !== 900 || manifest.designProfile?.desktop?.fit !== 'contain' || manifest.designProfile?.desktop?.crop !== false) throw new Error('Desktop landscape profile invalid');
            if (manifest.designProfile?.hero?.width !== 1920 || manifest.designProfile?.hero?.height !== 1080 || manifest.designProfile?.hero?.fit !== 'contain' || manifest.designProfile?.hero?.crop !== false) throw new Error('Hero no-crop profile invalid');

            const library = manifest.canonicalLibrary || {};
            if (Number(library.platformCount) !== 20 || Number(library.genreCount) !== 18 || !Array.isArray(library.files) || library.files.length !== 114) throw new Error('v8 canonical library coverage invalid');
            if (new Set((library.platforms || []).map((item) => item.sourceDigest)).size !== 20) throw new Error('platform masters are not unique');
            if (new Set((library.genres || []).map((item) => item.sourceDigest)).size !== 18) throw new Error('genre masters are not unique');
            for (const item of [...(library.platforms || []), ...(library.genres || [])]) {
              if (item.sourceKind !== 'individual-master-v8-hq') throw new Error('canonical library escaped v8 master: ' + JSON.stringify(item));
              if (Number(item.masterDimensions?.width) !== 1600 || Number(item.masterDimensions?.height) !== 900) throw new Error('canonical item dimensions invalid: ' + item.key);
            }

            const expectedPlatforms = ['netflix','prime-video','disney-plus','max','apple-tv-plus','paramount-plus','canal-plus','crunchyroll','anime-asia','tod','tabii','exxen','puhutv','tv-plus','tivibu','d-smart-go','s-sport-plus','bein-connect','blutv','mubi'];
            const expectedGenres = ['action','thriller','crime','science-fiction','fantasy','horror','comedy','romance','documentary','adventure','animation','anime','drama','mystery','western','music','sport','family'];
            const platformKeys = new Set((library.platforms || []).map((item) => item.key));
            const genreKeys = new Set((library.genres || []).map((item) => item.key));
            for (const key of expectedPlatforms) if (!platformKeys.has(key)) throw new Error('platform master missing: ' + key);
            for (const key of expectedGenres) if (!genreKeys.has(key)) throw new Error('genre master missing: ' + key);

            for (const key of expectedPlatforms) {
              for (const suffix of ['shield','desktop']) {
                const meta = await sharp(path.join('assets/generated-covers/_canonical/platforms', key + '-' + suffix + '.jpg')).metadata();
                if (meta.format !== 'jpeg' || meta.width !== 1600 || meta.height !== 900) throw new Error('bad platform card: ' + key + '-' + suffix);
              }
              const hero = await sharp(path.join('assets/generated-covers/_canonical/platforms', key + '-hero.jpg')).metadata();
              if (hero.format !== 'jpeg' || hero.width !== 1920 || hero.height !== 1080) throw new Error('bad platform hero: ' + key);
            }
            for (const key of expectedGenres) {
              for (const suffix of ['shield','desktop']) {
                const meta = await sharp(path.join('assets/generated-covers/_canonical/genres', key + '-' + suffix + '.jpg')).metadata();
                if (meta.format !== 'jpeg' || meta.width !== 1600 || meta.height !== 900) throw new Error('bad genre card: ' + key + '-' + suffix);
              }
              const hero = await sharp(path.join('assets/generated-covers/_canonical/genres', key + '-hero.jpg')).metadata();
              if (hero.format !== 'jpeg' || hero.width !== 1920 || hero.height !== 1080) throw new Error('bad genre hero: ' + key);
            }

            console.log(JSON.stringify({
              revision: manifest.revision,
              packSha256: source.sha256,
              masters: source.entryCount,
              platforms: library.platformCount,
              genres: library.genreCount,
              generatedFiles: manifest.generatedFiles,
              shield: '1600x900 contain/no-crop',
              hero: '1920x1080 contain/no-crop black-blend'
            }));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Build v8 individual-master visual preview
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');
          const platformKeys = ['netflix','prime-video','disney-plus','max','apple-tv-plus','paramount-plus','canal-plus','crunchyroll','anime-asia','tod','tabii','exxen','puhutv','tv-plus','tivibu','d-smart-go','s-sport-plus','bein-connect','blutv','mubi'];
          const genreKeys = ['action','thriller','crime','science-fiction','fantasy','horror','comedy','romance','documentary','adventure','animation','anime','drama','mystery','western','music','sport','family'];
          const heroKeys = ['netflix','prime-video','max','crunchyroll','tod','tabii','bein-connect','mubi'];

          (async () => {
            const width = 1920;
            const platformCellW = 380, platformCellH = 230;
            const genreCellW = 316, genreCellH = 190;
            const heroCellW = 470, heroCellH = 285;
            const platformTop = 20;
            const genreTop = platformTop + 4 * platformCellH + 20;
            const heroTop = genreTop + 3 * genreCellH + 30;
            const height = heroTop + 2 * heroCellH + 30;
            const composites = [];

            for (let i = 0; i < platformKeys.length; i++) {
              const file = path.join('assets/generated-covers/_canonical/platforms', platformKeys[i] + '-shield.jpg');
              const image = await sharp(file).resize(360, 203, { fit: 'contain', background: '#000000' }).jpeg({ quality: 94 }).toBuffer();
              composites.push({ input: image, left: 10 + (i % 5) * platformCellW, top: platformTop + Math.floor(i / 5) * platformCellH });
            }
            for (let i = 0; i < genreKeys.length; i++) {
              const file = path.join('assets/generated-covers/_canonical/genres', genreKeys[i] + '-shield.jpg');
              const image = await sharp(file).resize(296, 166, { fit: 'contain', background: '#000000' }).jpeg({ quality: 94 }).toBuffer();
              composites.push({ input: image, left: 10 + (i % 6) * genreCellW, top: genreTop + Math.floor(i / 6) * genreCellH });
            }
            for (let i = 0; i < heroKeys.length; i++) {
              const file = path.join('assets/generated-covers/_canonical/platforms', heroKeys[i] + '-hero.jpg');
              const image = await sharp(file).resize(450, 253, { fit: 'contain', background: '#000000' }).jpeg({ quality: 94 }).toBuffer();
              composites.push({ input: image, left: 10 + (i % 4) * heroCellW, top: heroTop + Math.floor(i / 4) * heroCellH });
            }

            await sharp({ create: { width, height, channels: 3, background: '#02040a' } })
              .composite(composites)
              .jpeg({ quality: 94, chromaSubsampling: '4:4:4' })
              .toFile('individual-masters-v8-preview.jpg');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Upload v8 individual-master visual preview
        uses: actions/upload-artifact@v4
        with:
          name: individual-masters-v8-preview
          path: individual-masters-v8-preview.jpg
          if-no-files-found: error
          retention-days: 7

      - name: Test neutral runtime layer
        run: npm run test:runtime

      - name: Test Oracle VM integration
        run: npm run test:oracle

      - name: Build final Oracle-compatible runtime assets
        env:
          PUBLIC_ORIGIN: https://141-145-215-202.nip.io
          NUVIO_RUNTIME: oracle-vm
        run: npm run build:runtime

      - name: Validate Oracle shell scripts
        run: |
          bash -n oracle/bootstrap.sh
          bash -n oracle/update.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: Validate Oracle Always Free Terraform
        run: |
          terraform -chdir=oracle/terraform fmt -check -diff -recursive
          terraform -chdir=oracle/terraform init -backend=false
          terraform -chdir=oracle/terraform validate
