name: Build Nuvio Desktop V9 Hero Trailer MSI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Checkout NuvioDesktop Dev
        shell: pwsh
        run: |
          git clone --branch Dev --single-branch https://github.com/NuvioMedia/NuvioDesktop.git NuvioDesktop

      - name: Apply V9 patch
        shell: pwsh
        run: |
          python builder/apply_nuvio_desktop_v9_hero_trailer.py NuvioDesktop

      - name: Fetch Windows runtime
        shell: bash
        working-directory: NuvioDesktop
        run: |
          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**,composeApp/src/desktopMain/resources/torrserver/windows-amd64/TorrServer.exe" --exclude=""

      - name: Resolve official Nuvio runtime configuration
        shell: pwsh
        working-directory: NuvioDesktop
        run: |
          @'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen
          req=Request("https://api.nuvio.tv/.well-known/nuvio",headers={"User-Agent":"NuvioDesktop-V9-Release"})
          with urlopen(req,timeout=20) as response:
              data=json.load(response)
          backend=str(data.get("backend_url","")).strip().rstrip("/")
          key=str(data.get("publishable_key","")).strip()
          if str(data.get("service","")).lower()!="nuvio" or backend!="https://api.nuvio.tv" or not key:
              raise SystemExit("Invalid official Nuvio discovery")
          Path("local.properties").write_text("\n".join([
              f"NUVIO_SUPABASE_URL={backend}",
              f"NUVIO_SUPABASE_ANON_KEY={key}",
              "NUVIO_SUPABASE_FALLBACK_URL=",
              "TRAKT_CLIENT_ID=",
              "TRAKT_CLIENT_SECRET=",
              "SENTRY_DSN=",
              "SENTRY_DESKTOP_DSN=",
              "",
          ]),encoding="utf-8")
          print("Official Nuvio runtime config resolved.")
          '@ | python -

      - name: Verify official Nuvio auth
        shell: pwsh
        working-directory: NuvioDesktop
        run: |
          @'
          from pathlib import Path
          from urllib.request import Request,urlopen
          values={}
          for line in Path("local.properties").read_text(encoding="utf-8").splitlines():
              if "=" in line:
                  k,v=line.split("=",1); values[k.strip()]=v.strip()
          backend=values["NUVIO_SUPABASE_URL"].rstrip("/")
          key=values["NUVIO_SUPABASE_ANON_KEY"]
          req=Request(backend+"/auth/v1/settings",headers={"apikey":key,"Authorization":"Bearer "+key,"User-Agent":"NuvioDesktop-V9-Release"})
          with urlopen(req,timeout=20) as response:
              if response.status!=200 or not response.read(1024):
                  raise SystemExit("Auth probe failed")
          print("Official Nuvio auth OK.")
          '@ | python -

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          $version = "1.0.4078.44"
          nuget install Microsoft.Web.WebView2 -Version $version -OutputDirectory "$env:RUNNER_TEMP\nuget" -DirectDownload -NonInteractive -NoCache
          $root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$version"
          "WEBVIEW2_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify V9 source contracts
        shell: pwsh
        working-directory: NuvioDesktop
        run: |
          @'
          from pathlib import Path
          root=Path(".")
          win=(root/"composeApp/src/windowsDesktopMain/kotlin/com/nuvio/app/features/details/components/HeroTrailerPlayerSurface.desktop.kt").read_text(encoding="utf-8")
          hero=(root/"composeApp/src/commonMain/kotlin/com/nuvio/app/features/home/components/CatalogHoverHero.kt").read_text(encoding="utf-8")
          hoverTrailer=(root/"composeApp/src/commonMain/kotlin/com/nuvio/app/features/home/components/HomePosterHoverTrailer.kt").read_text(encoding="utf-8")
          platform=(root/"composeApp/src/desktopMain/kotlin/com/nuvio/app/features/trailer/TrailerExtractionPlatform.desktop.kt").read_text(encoding="utf-8")
          main=(root/"composeApp/src/desktopMain/kotlin/com/nuvio/app/Main.kt").read_text(encoding="utf-8")
          bridge=(root/"composeApp/src/desktopMain/native/windows/player_bridge.cpp").read_text(encoding="utf-8")
          bridgeKt=(root/"composeApp/src/desktopMain/kotlin/com/nuvio/app/features/player/desktop/NativePlayerBridge.kt").read_text(encoding="utf-8")
          policy=(root/"composeApp/src/desktopMain/kotlin/com/nuvio/app/core/build/AppFeaturePolicy.desktop.kt").read_text(encoding="utf-8")
          settings=(root/"composeApp/src/commonMain/kotlin/com/nuvio/app/features/settings/HoverPreviewSettingsPage.kt").read_text(encoding="utf-8")
          style=(root/"composeApp/src/commonMain/kotlin/com/nuvio/app/core/ui/PosterCardStyleRepository.kt").read_text(encoding="utf-8")
          extractor=(root/"composeApp/src/fullCommonMain/kotlin/com/nuvio/app/features/trailer/InAppYouTubeExtractor.kt").read_text(encoding="utf-8")
          for text,token in [
              (win,"NativePlayerController"),
              (win,"SwingPanel"),
              (win,"latestOnReady.value()"),
              (win,"PlayerResizeMode.Zoom"),
              (win,"TrailerExtractionPlatform.defaultHeaders"),
              (win,"decoderPriority = 1"),
              (win,"heroTrailerControlsPageUrl"),
              (win,"requiredSize(2.dp)"),
              (bridge,'setMpvOptionStringLocked("user-agent"'),
              (bridge,'setMpvOptionStringLocked("referrer"'),
              (bridge,"heroTrailerMode"),
              (bridge,"format=rgb24"),
              (bridge,"pow(clip(X/(W*0.45),0,1),0.95)"),
              (bridge,"clip((Y/H-0.78)/0.22,0,1)"),
              (bridgeKt,"hero-player-ui"),
              (bridgeKt,"rgba(0,0,0,0.42) 45%"),
              (bridgeKt,"rgba(0,0,0,1.00) 0%"),
              (bridgeKt,"z-index: 2147483647 !important"),
              (bridgeKt,"pointer-events: none !important"),
              (platform,"windowsHost"),
              (hero,"fillMaxWidth(0.54f)"),
              (hero,"fillMaxWidth(0.43f)"),
              (hero,"fillMaxWidth(0.46f)"),
              (hero,"CatalogHeroInformationBed"),
              (hero,"trailerVisuallyReady"),
              (hero,"trailerPlaybackSource != null || trailerVisuallyReady"),
              (hero,"zIndex(10f)"),
              (hero,"zIndex(20f)"),
              (hero,"zIndex(30f)"),
              (hero,"zIndex(50f)"),
              (hero,"background(Color.Black)"),
              (hoverTrailer,"onPlaybackVisibilityChanged"),
              (hoverTrailer,"DisposableEffect"),
              (hero,"0.44f to backgroundColor.copy(alpha = 0.54f)"),
              (hero,"0.86f to backgroundColor.copy(alpha = 0.42f)"),
              (hero,"isCatalogHeroTrailerPlaybackEnabled"),
              (policy,"actual val heroTrailerPlaybackSupported: Boolean = true"),
              (settings,"AppFeaturePolicy.heroTrailerPlaybackSupported ||"),
              (style,"hoverPreviewTrailerConfigured"),
              (style,"hoverPreviewTrailerSoundConfigured"),
              (style,"hoverPreviewTrailerSoundEnabled: Boolean = isWindows"),
              (extractor,"FALLBACK_INNERTUBE_API_KEY"),
              (extractor,"retrying without visitor data"),
              (main,"HeroTrailerSmokeHarness"),
              (main,"error:hero-gate-disabled"),
              (main,"muted = false"),
              (main,"HERO INFORMATION"),
              (main,"CatalogHeroInformationBed"),
              (main,"visible = source.value != null"),
          ]:
              if token not in text:
                  raise SystemExit("Missing V9 contract: "+token)
          if "= Unit" in win:
              raise SystemExit("Windows Hero trailer player is still a stub")
          print("V9 source contracts OK.")
          '@ | python -

      - name: Compile Desktop
        shell: pwsh
        working-directory: NuvioDesktop
        run: |
          .\gradlew.bat :composeApp:compileKotlinDesktop "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" "-Pcompose.desktop.packaging.checkJdkVendor=false" --no-configuration-cache --no-daemon --stacktrace

      - name: Build MSI
        shell: pwsh
        working-directory: NuvioDesktop
        run: |
          .\gradlew.bat :composeApp:packageReleaseMsi "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" "-Pcompose.desktop.packaging.checkJdkVendor=false" --no-configuration-cache --no-daemon --stacktrace

      - name: Collect MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "NuvioDesktop\composeApp\build\compose" -Recurse -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "No MSI produced." }
          Copy-Item $msi.FullName "NuvioDesktop-V9-Hero-Trailer.msi"

      - name: Install packaged MSI
        shell: pwsh
        run: |
          $msiPath = (Resolve-Path "NuvioDesktop-V9-Hero-Trailer.msi").Path
          $proc = Start-Process msiexec.exe -ArgumentList "/i `"$msiPath`" /qn /norestart" -Wait -PassThru
          if ($proc.ExitCode -notin 0,3010) { throw "MSI install failed: $($proc.ExitCode)" }

      - name: Runtime Hero trailer first-frame smoke
        shell: pwsh
        env:
          NUVIO_TRAILER_DEBUG: "true"
          NUVIO_HERO_TRAILER_SMOKE_YOUTUBE_URL: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        run: |
          $candidates = @("$env:ProgramFiles\Nuvio\Nuvio.exe", "$env:LOCALAPPDATA\Programs\Nuvio\Nuvio.exe")
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            foreach ($root in @("$env:ProgramFiles", "$env:LOCALAPPDATA")) {
              if ($root -and (Test-Path $root)) {
                $found = Get-ChildItem -Path $root -Filter "Nuvio.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($found) { $exe = $found.FullName; break }
              }
            }
          }
          if (-not $exe) { throw "Installed Nuvio.exe not found." }

          $marker = Join-Path $env:RUNNER_TEMP "nuvio-hero-trailer-smoke.txt"
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          $env:NUVIO_HERO_TRAILER_SMOKE_MARKER = $marker
          $env:NUVIO_HERO_TRAILER_SMOKE_SCREENSHOT = Join-Path $env:GITHUB_WORKSPACE "NuvioDesktop-V9-Hero-Visual-Smoke.png"
          $stdout = Join-Path $env:RUNNER_TEMP "nuvio-hero-trailer-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "nuvio-hero-trailer-stderr.txt"
          Remove-Item $stdout,$stderr -Force -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          $deadline = (Get-Date).AddSeconds(90)
          $result = $null
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
            if (Test-Path $marker) {
              $result = (Get-Content $marker -Raw).Trim()
              Write-Host "Hero trailer smoke marker: $result"
              if ($result -eq "ready" -or $result.StartsWith("error:")) { break }
            }
            $app.Refresh()
            if ($app.HasExited) {
              throw "Nuvio exited during Hero trailer smoke. Exit=$($app.ExitCode) marker=$result"
            }
          }
          if ($result -ne "ready") {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
            Start-Sleep -Milliseconds 300
            Write-Host "=== Nuvio stdout ==="
            if (Test-Path $stdout) { Get-Content $stdout -Tail 400 }
            Write-Host "=== Nuvio stderr ==="
            if (Test-Path $stderr) { Get-Content $stderr -Tail 400 }
            throw "Hero trailer did not reach ready state. Marker=$result"
          }
          Write-Host "Hero trailer native Windows first-frame smoke PASSED."
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          Start-Sleep -Milliseconds 300
          if (Test-Path $stdout) { Get-Content $stdout -Tail 120 }
          if (Test-Path $stderr) { Get-Content $stderr -Tail 120 }

      - name: Final official service check
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Uri "https://api.nuvio.tv/.well-known/nuvio" -UseBasicParsing -TimeoutSec 20
          if ($response.StatusCode -ne 200) { throw "Official Nuvio service unavailable." }

      - name: Upload verified MSI
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-desktop-v9-hero-trailer-windows-msi
          path: |
            NuvioDesktop-V9-Hero-Trailer.msi
            NuvioDesktop-V9-Hero-Visual-Smoke.png
          retention-days: 14
