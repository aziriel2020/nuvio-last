name: Temporary Fix Desktop Production Probe
on:
  push:
    branches: [migration/oracle-only-final]
    paths: [".github/workflows/tmp-fix-desktop-prod-probe.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/oracle-only-final
          fetch-depth: 0
      - name: Replace fabricated source-less Desktop probe
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/verify-oracle-production.mjs')
          s=p.read_text()
          old="""// Explicit renderer routes requested for the migration contract.\nconst explicitVisuals = [\n  '/tr/platform-category-card.svg?provider=exxen&category=series',\n  '/tr/platform-backdrop.svg?provider=exxen&type=series',\n  '/tr/desktop-folder-card.jpg?provider=exxen&type=series&title=Exxen',\n  '/global/desktop-content-card.jpg?v=oracle-final&design=shield3&type=series&provider=anime-asia&label=Anime%20JP%2FKR&title=Oracle%20Anime&append=VALIDATION',\n  '/fr/genre-folder-art.svg?genre=action&variant=card&type=movie&label=Action',\n  '/static/assets/platform-art/tr/exxen-card.jpg',\n  '/static/assets/platform-art/tr/d-smart-go-backdrop.jpg',\n  '/static/assets/platform-art/global/anime-asia-card.jpg'\n];\nfor (const visual of explicitVisuals) await verifyVisual(new URL(visual, ORIGIN).toString(), visual);\n"""
          new="""// Explicit renderer routes requested for the migration contract.\n// Content-card validation must use a URL actually emitted by a live catalog so\n// its source artwork is real; a fabricated source-less URL is intentionally invalid.\nconst liveDesktopContentVisual = flattenStrings([\n  ...animeSeriesMetas,\n  ...animeMovieMetas,\n  ...trCatalogResults.flatMap((row) => row.metas || [])\n]).find((value) => {\n  try {\n    const u = new URL(value);\n    return u.origin === ORIGIN && /\\/desktop-content-card\\.jpg$/.test(u.pathname) && Boolean(u.searchParams.get('src'));\n  } catch {\n    return false;\n  }\n});\nassert(liveDesktopContentVisual, 'No emitted Desktop content-card URL with a real source was discovered');\n\nconst explicitVisuals = [\n  '/tr/platform-category-card.svg?provider=exxen&category=series',\n  '/tr/platform-backdrop.svg?provider=exxen&type=series',\n  '/tr/desktop-folder-card.jpg?provider=exxen&type=series&title=Exxen',\n  liveDesktopContentVisual,\n  '/fr/genre-folder-art.svg?genre=action&variant=card&type=movie&label=Action',\n  '/static/assets/platform-art/tr/exxen-card.jpg',\n  '/static/assets/platform-art/tr/d-smart-go-backdrop.jpg',\n  '/static/assets/platform-art/global/anime-asia-card.jpg'\n];\nfor (const visual of explicitVisuals) await verifyVisual(new URL(visual, ORIGIN).toString(), visual);\n"""
          if old not in s:
              raise SystemExit('source-less explicit Desktop production probe block not found')
          p.write_text(s.replace(old,new,1))
          PY
          npm install --no-audit --no-fund
          node --check scripts/verify-oracle-production.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-oracle-production.mjs
          git commit -m "test: validate a real emitted Desktop content card in production"
          git push origin HEAD:migration/oracle-only-final
