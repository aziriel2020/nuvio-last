name: Audit Oracle Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Oracle Production"]
    types: [completed]
  schedule:
    - cron: '15 5,17 * * *'

permissions:
  contents: read

concurrency:
  group: oracle-production-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUBLIC_ORIGIN: https://141-145-215-202.nip.io
      VERIFY_TIMEOUT_MS: 30000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install audit dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Oracle production
        if: github.event_name != 'schedule'
        run: node scripts/verify-oracle-production.mjs
      - name: Inventory all Nuvio collection and catalog links across FR, US, TR and Global
        if: success() || failure()
        env:
          AUDIT_INVENTORY_REPORT: audit-collection-inventory.json
        run: node scripts/audit-collection-inventory.mjs
      - name: Audit every active streaming platform catalog and verified premiere across FR, US, TR and Global
        env:
          AUDIT_ALL_PLATFORMS: '1'
        run: node scripts/check-premiere-coverage.mjs
      - name: Audit full Nuvio collection pack - active families and latest archives
        if: success() || failure()
        env:
          AUDIT_RUNTIME: oracle-vm
          AUDIT_MODE: safe
          AUDIT_DESKTOP_CARDS: '0'
          AUDIT_META_SAMPLES: '1'
          AUDIT_CONCURRENCY: '2'
          AUDIT_INTERVAL_MS: '250'
          AUDIT_TIMEOUT_MS: '30000'
          AUDIT_REQUEST_BUDGET: '12000'
          AUDIT_REPORT: audit-collections-active.json
        run: node scripts/audit-production-catalogs.mjs
      - name: Audit historical archives across all collection families - rotating year
        if: (success() || failure()) && github.event_name == 'schedule'
        env:
          AUDIT_RUNTIME: oracle-vm
          AUDIT_MODE: targeted
          AUDIT_DESKTOP_CARDS: '0'
          AUDIT_META_SAMPLES: '0'
          AUDIT_CONCURRENCY: '2'
          AUDIT_INTERVAL_MS: '300'
          AUDIT_TIMEOUT_MS: '30000'
          AUDIT_REQUEST_BUDGET: '12000'
          AUDIT_REPORT: audit-collections-history.json
        run: |
          YEAR=$((2015 + ( $(date -u +%s) / 43200 ) % 16))
          echo "Auditing all movie and series archive catalogs for year $YEAR across FR, US, TR and Global"
          AUDIT_YEARS="$YEAR" node scripts/audit-production-catalogs.mjs
      - name: Verify approved France streaming-service artwork
        if: success() || failure()
        run: node scripts/verify-fr-service-production.mjs
      - name: Verify approved Anime Japon Coree artwork and catalogue thumbnails
        if: success() || failure()
        env:
          ANIME_VERIFY_CATALOGS: '1'
        run: node scripts/verify-anime-production.mjs
      - name: Upload all-collections audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-all-collections-audits
          path: |
            audit-collection-inventory.json
            audit-collections-active.json
            audit-collections-history.json
          if-no-files-found: ignore
          retention-days: 14
