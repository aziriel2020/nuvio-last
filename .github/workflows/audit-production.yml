name: Audit Production Catalogs

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Deploy Cloudflare Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    env:
      PUBLIC_ORIGIN: https://nuvio-last-aziriel2020-1343705637.pages.dev
      AUDIT_STRICT: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
      AUDIT_CONCURRENCY: ${{ github.event_name == 'workflow_run' && '12' || '24' }}
      AUDIT_ATTEMPTS: ${{ github.event_name == 'workflow_run' && '2' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/audit-production-catalogs.mjs
