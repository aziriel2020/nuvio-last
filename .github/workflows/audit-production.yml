name: Audit Oracle Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Oracle Production"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: oracle-production-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_ORIGIN: https://141-145-215-202.nip.io
      VERIFY_TIMEOUT_MS: 30000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Oracle production
        run: node scripts/verify-oracle-production.mjs
