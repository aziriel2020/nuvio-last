name: Audit Oracle Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Oracle Production"]
    types: [completed]
  schedule:
    - cron: '15 5,17 * * *'

permissions:
  contents: read

concurrency:
  group: oracle-production-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_ORIGIN: https://141-145-215-202.nip.io
      VERIFY_TIMEOUT_MS: 30000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install audit dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Oracle production
        if: github.event_name != 'schedule'
        run: node scripts/verify-oracle-production.mjs
      - name: Assert officially verified streaming releases are present
        run: node scripts/check-premiere-coverage.mjs
      - name: Daily audit of every platform movie folder across FR, US, TR and Global
        if: github.event_name == 'schedule'
        env:
          AUDIT_ALL_PLATFORMS: '1'
        run: node scripts/check-premiere-coverage.mjs
      - name: Verify approved France streaming-service artwork
        run: node scripts/verify-fr-service-production.mjs
      - name: Verify approved Anime Japon Coree artwork and catalogue thumbnails
        env:
          ANIME_VERIFY_CATALOGS: '1'
        run: node scripts/verify-anime-production.mjs
