name: Audit Oracle Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Oracle Production"]
    types: [completed]
  schedule:
    - cron: '15 */4 * * *'

permissions:
  contents: read

concurrency:
  group: oracle-production-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PUBLIC_ORIGIN: https://141-145-215-202.nip.io
      VERIFY_TIMEOUT_MS: 30000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install audit dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Oracle production
        if: github.event_name != 'schedule'
        run: node scripts/verify-oracle-production.mjs
      - name: Inventory all Nuvio collection and catalog links across FR, US, TR and Global
        if: success() || failure()
        env:
          AUDIT_INVENTORY_REPORT: audit-collection-inventory.json
        run: node scripts/audit-collection-inventory.mjs
      - name: Verify premieres and every platform's Today/Yesterday dates (films and series)
        if: success() || failure()
        env:
          AUDIT_ALL_PLATFORMS: '1'
        run: node scripts/check-premiere-coverage.mjs
      - name: Audit bounded sample across all active collection families
        if: (success() || failure()) && github.event_name == 'schedule'
        env:
          AUDIT_RUNTIME: oracle-vm
          AUDIT_MODE: safe
          AUDIT_SHARD_COUNT: '64'
          AUDIT_DESKTOP_CARDS: '0'
          AUDIT_META_SAMPLES: '1'
          AUDIT_CONCURRENCY: '1'
          AUDIT_ATTEMPTS: '2'
          AUDIT_INTERVAL_MS: '650'
          AUDIT_TIMEOUT_MS: '20000'
          AUDIT_REQUEST_BUDGET: '600'
          AUDIT_REPORT: audit-collections-active.json
        run: |
          AUDIT_SHARD_INDEX="$(( ($(date -u +%s) / 14400) % 64 ))" node scripts/audit-production-catalogs.mjs
      - name: Audit every historical catalog in rotating, rate-limited shards
        if: (success() || failure()) && github.event_name == 'schedule'
        env:
          AUDIT_RUNTIME: oracle-vm
          AUDIT_MODE: full
          AUDIT_SHARD_COUNT: '256'
          AUDIT_DESKTOP_CARDS: '0'
          AUDIT_META_SAMPLES: '0'
          AUDIT_CONCURRENCY: '1'
          AUDIT_ATTEMPTS: '2'
          AUDIT_INTERVAL_MS: '650'
          AUDIT_TIMEOUT_MS: '20000'
          AUDIT_REQUEST_BUDGET: '700'
          AUDIT_REPORT: audit-collections-history.json
        run: |
          AUDIT_SHARD_INDEX="$(( ($(date -u +%s) / 14400) % 256 ))" node scripts/audit-production-catalogs.mjs
      - name: Verify Films Monde live catalog and performance import
        if: success() || failure()
        run: node scripts/verify-films-monde-production.mjs
      - name: Verify approved France streaming-service artwork
        if: success() || failure()
        run: node scripts/verify-fr-service-production.mjs
      - name: Verify approved Anime Japon Coree artwork and catalogue thumbnails
        if: success() || failure()
        env:
          ANIME_VERIFY_CATALOGS: '1'
        run: node scripts/verify-anime-production.mjs
      - name: Upload all-collections audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-all-collections-audits
          path: |
            audit-collection-inventory.json
            audit-collections-active.json
            audit-collections-history.json
          if-no-files-found: ignore
          retention-days: 14
