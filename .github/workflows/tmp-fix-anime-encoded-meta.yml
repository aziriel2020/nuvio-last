name: Temporary Fix Shared Platform Assets

on:
  push:
    branches:
      - migration/oracle-only-final
    paths:
      - ".github/workflows/tmp-fix-anime-encoded-meta.yml"

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/oracle-only-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Türkiye shared JPEG asset routing and regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('runtime/router.mjs')
          text = runtime.read_text()
          needle = "return `/static/assets/platform-art/${match[1]}/${provider}-${variant}.jpg`;"
          replacement = """if (match[1] === 'tr' && provider === 'crunchyroll') return `/static/assets/platform-art/global/anime-asia-${variant}.jpg`;
              if (match[1] === 'tr' && provider === 'bi-kanal') return `/static/assets/platform-art/tr/turkiye-takvim-${variant}.jpg`;
              return `/static/assets/platform-art/${match[1]}/${provider}-${variant}.jpg`;"""
          if needle not in text:
              raise SystemExit('expected generic platform asset return not found')
          runtime.write_text(text.replace(needle, replacement, 1))

          test_file = Path('test/runtime.test.js')
          tests = test_file.read_text()
          anchor = "  assert.equal(router.localAssetPath('https://oracle.example/tr/platform-card.jpg?provider=exxen'), '/static/assets/platform-art/tr/exxen-card.jpg');\n"
          additions = anchor + "  assert.equal(router.localAssetPath('https://oracle.example/tr/platform-backdrop.jpg?provider=crunchyroll'), '/static/assets/platform-art/global/anime-asia-backdrop.jpg');\n  assert.equal(router.localAssetPath('https://oracle.example/tr/platform-backdrop.jpg?provider=bi-kanal'), '/static/assets/platform-art/tr/turkiye-takvim-backdrop.jpg');\n"
          if "localAssetPath('https://oracle.example/tr/platform-backdrop.jpg?provider=bi-kanal')" not in tests:
              if anchor not in tests:
                  raise SystemExit('runtime localAssetPath test anchor not found')
              test_file.write_text(tests.replace(anchor, additions, 1))
          PY
      - name: Install and run runtime tests
        run: |
          npm install --no-audit --no-fund
          node --check runtime/router.mjs
          npm run test:runtime
      - name: Commit fix to migration branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/router.mjs test/runtime.test.js
          git diff --cached --check
          git commit -m "fix: serve shared Türkiye platform artwork from Oracle assets"
          git push origin HEAD:migration/oracle-only-final
