name: Temporary Harden Desktop Production Audit
on:
  push:
    branches: [migration/oracle-only-final]
    paths: [".github/workflows/tmp-harden-desktop-prod-audit.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/oracle-only-final
          fetch-depth: 0
      - name: Require true 1600x900 JPEGs in production audit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/verify-oracle-production.mjs')
          s=p.read_text()
          if "import sharp from 'sharp';" not in s:
              s=s.replace('#!/usr/bin/env node\n', "#!/usr/bin/env node\nimport sharp from 'sharp';\n", 1)

          old="""  if (url.pathname.endsWith('/desktop-content-card.jpg') && type.includes('svg')) {\n    assert(result.response.headers.get('x-nuvio-card-renderer') === 'calendar-overlay-v2', `${label}: unexpected content renderer`);\n    assert(result.text.includes('data-renderer=\"shield-desktop-v3\"'), `${label}: Shield Desktop v3 marker missing`);\n  }\n"""
          new="""  if (/\\/desktop-(?:content|folder|genre)-card\\.jpg$/.test(url.pathname)) {\n    assert(type.startsWith('image/jpeg'), `${label}: Desktop card must be a native JPEG, got ${type}`);\n    assert(result.response.headers.get('x-nuvio-card-renderer') === 'shield-desktop-jpeg-v4', `${label}: Desktop renderer marker missing`);\n    assert(result.response.headers.get('x-nuvio-desktop-format') === '1600x900', `${label}: Desktop format marker missing`);\n    assert(result.bytes[0] === 0xff && result.bytes[1] === 0xd8, `${label}: invalid JPEG signature`);\n    const metadata = await sharp(result.bytes).metadata();\n    assert(metadata.format === 'jpeg' && metadata.width === 1600 && metadata.height === 900, `${label}: expected 1600x900 JPEG, got ${metadata.format} ${metadata.width}x${metadata.height}`);\n  }\n"""
          if old not in s:
              raise SystemExit('old Desktop SVG production audit block not found')
          s=s.replace(old,new,1)

          marker="""assert(Array.isArray(desktop) && desktop.length === standard.length, `Desktop count ${desktop?.length} != standard ${standard.length}`);\n"""
          extra=marker+"""const desktopVisualUrls = flattenStrings(desktop).filter((value) => {\n  try { return /\\/desktop-(?:folder|genre)-card\\.jpg$/.test(new URL(value).pathname); } catch { return false; }\n});\nassert(desktopVisualUrls.length > 0, 'Desktop collection import has no native Desktop card URLs');\nfor (const value of desktopVisualUrls) {\n  const visualUrl = new URL(value);\n  assert(visualUrl.origin === ORIGIN, `Desktop collection visual escaped Oracle: ${value}`);\n  assert(visualUrl.searchParams.get('v')?.includes('desktop12-shield-jpeg'), `Desktop collection visual has stale renderer revision: ${value}`);\n}\n"""
          if 'Desktop collection import has no native Desktop card URLs' not in s:
              if marker not in s: raise SystemExit('desktop collection assertion marker missing')
              s=s.replace(marker,extra,1)
          p.write_text(s)
          PY
          node --check scripts/verify-oracle-production.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-oracle-production.mjs
          git commit -m "test: require native 1600x900 Desktop JPEGs in production"
          git push origin HEAD:migration/oracle-only-final
