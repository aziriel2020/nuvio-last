name: Diagnose movie index retry

on:
  push:
    branches: [diagnose/movie-index-retry-20261026]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUBLIC_IP: 141.145.215.202
    steps:
      - name: Install Oracle SSH key
        shell: bash
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$RUNNER_TEMP/keys"
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          raw=os.environ["ORACLE_SSH_PRIVATE_KEY"].strip()
          vals=[raw]
          if len(raw)>=2 and raw[0]==raw[-1]=='"':
              try: vals.append(json.loads(raw))
              except Exception: pass
          for v in list(vals):
              vals.append(v.replace(chr(13),"").replace(chr(92)+"r","").replace(chr(92)+"n",chr(10)))
              try: vals.append(base64.b64decode(v,validate=True).decode())
              except Exception: pass
          for v in vals:
              v=v.replace(chr(13),"")
              for label in ("OPENSSH PRIVATE KEY","PRIVATE KEY","RSA PRIVATE KEY"):
                  b="-----BEGIN "+label+"-----"; e="-----END "+label+"-----"
                  if b in v and e in v:
                      body="".join(v.split(b,1)[1].split(e,1)[0].split())
                      if body:
                          p=Path(os.environ["RUNNER_TEMP"]+"/keys/oracle_ssh.pem")
                          p.write_text(b+"\n"+body+"\n"+e+"\n")
                          raise SystemExit(0)
          raise SystemExit("ORACLE_SSH_PRIVATE_KEY is not a usable private key")
          PY
          chmod 600 "$RUNNER_TEMP/keys/oracle_ssh.pem"
          ssh-keygen -y -f "$RUNNER_TEMP/keys/oracle_ssh.pem" >/dev/null
          echo "ORACLE_SSH_KEY=$RUNNER_TEMP/keys/oracle_ssh.pem" >> "$GITHUB_ENV"

      - name: Retry the identified movie with the existing production indexer
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$ORACLE_SSH_KEY" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 ubuntu@"$PUBLIC_IP" \
            "sudo bash -s" <<'REMOTE'
          set -Eeuo pipefail
          set -a
          source /etc/nuvio/nuvio.env
          set +a
          cd /opt/nuvio/current
          export NUVIO_MOVIES_DB=/var/lib/nuvio-movies/index.sqlite
          sudo --preserve-env=TMDB_READ_TOKEN,TMDB_API_KEY,NUVIO_MOVIES_DB -u nuvio /usr/bin/node <<'NODE'
          const { MovieStore, defaultPath } = require('./regions/movies/src/store.cjs');
          const { runDetailJobs } = require('./scripts/sync-movies-world.cjs');
          const id = 1439321;
          const store = new MovieStore(defaultPath());
          store.db.exec('PRAGMA busy_timeout=10000');
          const summarize = row => row && ({ source:row.source, source_id:row.source_id, attempts:row.attempts, dueAt:new Date(row.due).toISOString(), last_error:row.last_error });
          (async () => {
            try {
              const before = store.db.prepare('SELECT * FROM jobs WHERE source=? AND source_id=?').get('movie-detail',id);
              if (!before || before.attempts !== 1 || before.last_error !== 'Incomplete movie availability/release response')
                throw new Error('Target job changed; inspect before retrying');
              store.jobs = source => source === 'movie-detail' ? [before] : [];
              await runDetailJobs(store, {limit:1,concurrency:1,delay:0});
              const after = store.db.prepare('SELECT * FROM jobs WHERE source=? AND source_id=?').get('movie-detail',id);
              const totals = store.db.prepare('SELECT COUNT(*) AS total,SUM(CASE WHEN attempts>0 THEN 1 ELSE 0 END) AS failed FROM jobs').get();
              console.log('NUVIO_RETRY_RESULT '+JSON.stringify({at:new Date().toISOString(),before:summarize(before),after:summarize(after),totals}));
              if (after.attempts !== 0 || after.last_error !== null) throw new Error('Targeted metadata retry did not succeed');
            } finally { store.close(); }
          })().catch(error => {console.error(error.message);process.exitCode=1;});
          NODE
          REMOTE
