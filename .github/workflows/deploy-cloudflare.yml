name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "regions/**"
      - "assets/**"
      - "cloudflare/**"
      - "scripts/build-cloudflare.js"
      - "scripts/build-cloudflare-worker.js"
      - "scripts/configure-cloudflare-pages.mjs"
      - "package.json"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 7b21859ab1740325151b97717cedc0e7
      CLOUDFLARE_PROJECT_NAME: nuvio-last-aziriel2020-1343705637
      PUBLIC_ORIGIN: https://nuvio-last-aziriel2020-1343705637.pages.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run regression tests
        run: |
          npm test
          npm run test:cloudflare

      - name: Build Cloudflare Pages output
        run: npm run build:cloudflare

      - name: Verify Cloudflare Pages project
        shell: bash
        run: |
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Accept: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT_NAME" \
            -o "$RUNNER_TEMP/cloudflare-existing-project.json"
          node - "$RUNNER_TEMP/cloudflare-existing-project.json" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!payload?.success || payload?.result?.name !== process.env.CLOUDFLARE_PROJECT_NAME) {
            throw new Error('Expected Cloudflare Pages project was not found.');
          }
          console.log('Cloudflare Pages project exists.');
          NODE

      - name: Verify Cloudflare application credentials
        shell: bash
        run: |
          curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Accept: application/json"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT_NAME"             -o "$RUNNER_TEMP/cloudflare-project-after.json"
          node - "$RUNNER_TEMP/cloudflare-project-after.json" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const vars = payload?.result?.deployment_configs?.production?.env_vars || {};
          if (!vars.TMDB_READ_TOKEN && !vars.TMDB_API_KEY) {
            throw new Error('Cloudflare has no TMDB credential.');
          }
          console.log('Cloudflare TMDB credential is configured.');
          NODE

      - name: Configure Cloudflare fail-closed runtime
        run: node scripts/configure-cloudflare-pages.mjs
        continue-on-error: true

      - name: Deploy Cloudflare-native Nuvio
        id: deploy
        shell: bash
        run: |
          npx --yes wrangler@latest pages deploy dist             --project-name="$CLOUDFLARE_PROJECT_NAME"             --branch=main             --commit-hash="$GITHUB_SHA"

      - name: Verify Cloudflare-only production
        shell: bash
        run: |
          node - <<'NODE'
          const origin = process.env.PUBLIC_ORIGIN;

          async function retry(path, attempts = 8, acceptedStatuses = []) {
            let response = null;
            let lastError = null;
            for (let attempt = 1; attempt <= attempts; attempt++) {
              try {
                response = await fetch(origin + path, { redirect: 'follow' });
                lastError = null;
                if (response.ok || acceptedStatuses.includes(response.status)) return response;
              } catch (error) {
                lastError = error;
              }
              if (attempt < attempts) {
                await new Promise((resolve) => setTimeout(resolve, Math.min(attempt * 1500, 7500)));
              }
            }

            if (response) {
              let body = '';
              try { body = (await response.clone().text()).replace(/\s+/g, ' ').slice(0, 600); } catch {}
              const ray = response.headers.get('cf-ray') || 'n/a';
              const server = response.headers.get('server') || 'n/a';
              throw new Error(`${path} failed with HTTP ${response.status}; cf-ray=${ray}; server=${server}; body=${body || '<empty>'}`);
            }
            throw new Error(`${path} failed without response: ${lastError?.message || 'unknown network error'}`);
          }

          async function runCheck(label, fn, failures) {
            try {
              return await fn();
            } catch (error) {
              const message = `${label}: ${error?.message || error}`;
              failures.push(message);
              console.error(`CHECK FAILED ${message}`);
              return null;
            }
          }

          async function checkStatic() {
            const checks = [
              '/',
              '/edge-build.json',
              '/nuvio-collections-fr-global-tr-usa.json',
              '/nuvio-collections-desktop.json',
              '/fr/manifest.json',
              '/global/manifest.json',
              '/tr/manifest.json',
              '/us/manifest.json'
            ];
            for (const path of checks) {
              const response = await retry(path);
              if (path === '/nuvio-collections-fr-global-tr-usa.json') {
                const data = await response.json();
                if (!Array.isArray(data) || data.length !== 48) throw new Error('Unexpected collection count');
                const text = JSON.stringify(data);
                if (/vercel\.app/i.test(text)) throw new Error('Collections still reference Vercel');
              } else {
                await response.arrayBuffer();
              }
              console.log(`STATIC OK ${path}`);
            }
          }

          async function checkDynamicRegion(region) {
            const manifest = await (await retry(`/${region}/manifest.json`)).json();
            const catalog = manifest.catalogs.find((entry) => /today/i.test(entry.id));
            if (!catalog) throw new Error(`No Today catalog found for ${region}`);
            const path = `/${region}/catalog/${catalog.type}/${catalog.id}.json`;
            const response = await retry(path, 6);
            const edge = response.headers.get('x-nuvio-origin');
            if (edge !== 'cloudflare-only') {
              throw new Error(`${path} is not served by the Cloudflare-native runtime: ${edge}`);
            }
            const payload = await response.json();
            if (!Array.isArray(payload?.metas)) throw new Error(`${path} did not return metas`);
            console.log(`DYNAMIC OK ${path} (${payload.metas.length} metas)`);
            return payload;
          }

          async function checkDesktopContentOverlay(payload) {
            const meta = payload?.metas?.find((entry) => String(entry?.banner || '').includes('/desktop-content-card.jpg'));
            if (!meta) throw new Error('France Today catalog has no desktop content card to verify');

            const banner = new URL(meta.banner);
            if (!/desktop11$/.test(banner.searchParams.get('v') || '')) {
              throw new Error(`Desktop content card did not receive the desktop11 cache revision: ${banner}`);
            }
            if (!banner.searchParams.get('title') || !banner.searchParams.get('append') || !banner.searchParams.get('label')) {
              throw new Error('Desktop content card URL is missing title/append/provider metadata');
            }

            const response = await retry(banner.pathname + banner.search, 6);
            if (!String(response.headers.get('content-type') || '').includes('image/svg+xml')) {
              throw new Error(`Desktop content card is not the metadata SVG renderer: ${response.headers.get('content-type')}`);
            }
            if (response.headers.get('x-nuvio-card-renderer') !== 'calendar-overlay-v2') {
              throw new Error('Desktop content card did not use calendar-overlay-v2');
            }
            const svg = await response.text();
            if (!svg.includes('<svg') || !svg.includes('desktop-content-card') && svg.length < 1000) {
              throw new Error('Desktop content card SVG looks incomplete');
            }
            console.log(`DESKTOP OVERLAY OK ${banner.pathname} (${banner.searchParams.get('title')})`);
          }

          async function checkGlobalAnimeCollection() {
            const [collectionsResponse, manifestResponse] = await Promise.all([
              retry('/global/nuvio-collections.json'),
              retry('/global/manifest.json')
            ]);
            const collections = await collectionsResponse.json();
            const manifest = await manifestResponse.json();
            const anime = collections.find((entry) => entry?.id === 'calendar-archives-global-anime');
            if (!anime) throw new Error('Global Anime Japon + Corée collection is missing');
            const seriesFolder = anime.folders?.find((entry) => entry?.title === 'Séries');
            const movieFolder = anime.folders?.find((entry) => entry?.title === 'Films');
            if (!seriesFolder || !movieFolder) throw new Error('Global anime collection is missing Series/Films folders');
            if (!seriesFolder.sources?.length || !movieFolder.sources?.length) throw new Error('Global anime collection has empty source lists');

            const metaResource = (manifest.resources || []).find((entry) => entry?.name === 'meta');
            if (!manifest.idPrefixes?.includes('anilist:') || !metaResource?.idPrefixes?.includes('anilist:')) {
              throw new Error('Global manifest does not expose anilist: in both idPrefixes locations');
            }

            const catalogKeys = new Set((manifest.catalogs || []).map((entry) => `${entry.type}:${entry.id}`));
            for (const source of [...seriesFolder.sources.slice(0, 5), ...movieFolder.sources.slice(0, 5)]) {
              if (!catalogKeys.has(`${source.type}:${source.catalogId}`)) {
                throw new Error(`Global anime collection source is unresolved: ${source.type}:${source.catalogId}`);
              }
            }

            async function loadSource(source, label, requireNonEmpty = false) {
              if (!source) throw new Error(`Missing Global Anime source for ${label}`);
              const path = `/global/catalog/${source.type}/${source.catalogId}.json`;
              const response = await retry(path, 8);
              if (response.headers.get('x-nuvio-origin') !== 'cloudflare-only') {
                throw new Error(`${path} is not Cloudflare-native`);
              }
              const payload = await response.json();
              if (!Array.isArray(payload?.metas)) throw new Error(`${path} did not return metas`);
              if (requireNonEmpty && payload.metas.length === 0) throw new Error(`${path} is unexpectedly empty`);
              console.log(`GLOBAL ANIME ${label} OK ${path} (${payload.metas.length} metas)`);
              return payload;
            }

            const sourceBySuffix = (folder, suffix) =>
              folder.sources.find((source) => String(source.catalogId || '').endsWith(suffix));

            const now = new Date();
            const previousMonthDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() - 1, 1));
            const previousMonth = `${previousMonthDate.getUTCFullYear()}-${String(previousMonthDate.getUTCMonth() + 1).padStart(2, '0')}`;

            const seriesChecks = [
              ['TODAY', sourceBySuffix(seriesFolder, '-today'), false],
              ['TOMORROW', sourceBySuffix(seriesFolder, '-tomorrow'), false],
              ['YESTERDAY', sourceBySuffix(seriesFolder, '-yesterday'), false],
              ['NEXTWEEK', sourceBySuffix(seriesFolder, '-nextweek'), false],
              ['LASTWEEK', sourceBySuffix(seriesFolder, '-lastweek'), false],
              [`HISTORY ${previousMonth}`, sourceBySuffix(seriesFolder, `-${previousMonth}`), false]
            ];

            const payloads = [];
            for (const [label, source, requireNonEmpty] of seriesChecks) {
              payloads.push(await loadSource(source, label, requireNonEmpty));
            }

            await loadSource(sourceBySuffix(movieFolder, '-today'), 'MOVIE TODAY', false);

            const allAnimeMetas = payloads.flatMap((payload) => payload.metas || []);
            if (!allAnimeMetas.length) {
              throw new Error('Global Anime JP/KR returned no content across the validated rolling/history windows');
            }

            const fallbackMeta = allAnimeMetas.find((meta) => String(meta?.id || '').startsWith('anilist:'));
            if (fallbackMeta) {
              if (!fallbackMeta.poster || !fallbackMeta.background || !fallbackMeta.landscapePoster || !fallbackMeta.name) {
                throw new Error(`AniList fallback ${fallbackMeta.id} is missing artwork/title metadata`);
              }
              if (!/Épisode\s+\d+/i.test(String(fallbackMeta.releaseInfo || ''))) {
                throw new Error(`AniList fallback ${fallbackMeta.id} is missing episode releaseInfo`);
              }
            }

            const metaTarget = fallbackMeta || allAnimeMetas[0];
            const metaType = metaTarget.type || 'series';
            const metaId = String(metaTarget.id);
            const metaResponse = await retry(`/global/meta/${metaType}/${encodeURIComponent(metaId)}.json`, 8);
            const metaPayload = await metaResponse.json();
            if (metaPayload?.meta?.id !== metaId) throw new Error(`Global Anime meta route did not resolve ${metaId}`);

            const fallbackCount = allAnimeMetas.filter((meta) => String(meta?.id || '').startsWith('anilist:')).length;
            console.log(`GLOBAL ANIME OK: ${allAnimeMetas.length} metas, ${fallbackCount} AniList-native; meta ${metaId} OK`);
          }

          async function checkGlobalVod() {
            const path = '/global/catalog/movie/archives-global-v1-movie-vod-global-today.json';
            const response = await retry(path, 8);
            if (response.headers.get('x-nuvio-origin') !== 'cloudflare-only') throw new Error(`${path} is not Cloudflare-native`);
            const payload = await response.json();
            if (!Array.isArray(payload?.metas)) throw new Error(`${path} did not return metas`);
            console.log(`GLOBAL VOD OK ${path} (${payload.metas.length} metas)`);
          }

          async function checkTransferredPlatformAssets() {
            const checks = [
              '/tr/platform-category-card.svg?provider=tod&category=series&asset=2',
              '/tr/platform-backdrop.svg?provider=tod&type=series&asset=2',
              '/tr/desktop-folder-card.jpg?provider=tod&type=series&title=S%C3%A9ries&label=%F0%9F%87%B9%F0%9F%87%B7%20TOD&asset=2&v=desktop10',
              '/tr/platform-category-card.svg?provider=crunchyroll&category=series&asset=2',
              '/tr/desktop-folder-card.jpg?provider=crunchyroll&type=series&title=S%C3%A9ries&label=Crunchyroll&asset=2&v=desktop10'
            ];
            for (const path of checks) {
              const response = await retry(path, 6);
              if (!String(response.headers.get('content-type') || '').includes('image/svg+xml')) {
                throw new Error(`${path} is not rendered as an SVG visual`);
              }
              if (response.headers.get('x-nuvio-asset-background') !== 'embedded') {
                throw new Error(`${path} did not embed the transferred platform JPG asset`);
              }
              if (response.headers.get('x-nuvio-visual-renderer') !== 'platform-assets-v2') {
                throw new Error(`${path} did not use platform-assets-v2`);
              }
              const svg = await response.text();
              if (!svg.includes('data:image/jpeg;base64,') && !svg.includes('data:image/jpg;base64,')) {
                throw new Error(`${path} SVG does not contain the platform artwork`);
              }
              console.log(`PLATFORM ASSET OK ${path}`);
            }
          }

          async function main() {
            await checkStatic();
            const failures = [];

            await runCheck('health', async () => {
              const health = await retry('/health', 8);
              if (health.headers.get('x-nuvio-origin') !== 'cloudflare-only') throw new Error('/health is not Cloudflare-native');
              await health.arrayBuffer();
              console.log('HEALTH OK /health');
            }, failures);

            await runCheck('shield calendar card', async () => {
              const shieldCard = await retry('/fr/calendar-card.svg?title=Cloudflare&type=movie', 6, [400]);
              if (![200, 400].includes(shieldCard.status) || !String(shieldCard.headers.get('content-type') || '').includes('image/svg+xml')) {
                throw new Error(`Shield calendar card is not SVG (HTTP ${shieldCard.status})`);
              }
              if (shieldCard.headers.get('x-nuvio-origin') !== 'cloudflare-only') {
                throw new Error('Shield calendar card is not Cloudflare-native');
              }
              console.log('SHIELD CARD OK');
            }, failures);

            await runCheck('transferred platform assets', checkTransferredPlatformAssets, failures);

            const frPayload = await runCheck('FR dynamic', () => checkDynamicRegion('fr'), failures);
            if (frPayload) await runCheck('Desktop content overlay', () => checkDesktopContentOverlay(frPayload), failures);

            await runCheck('GLOBAL dynamic', () => checkDynamicRegion('global'), failures);
            await runCheck('GLOBAL Anime JP/KR', checkGlobalAnimeCollection, failures);
            await runCheck('GLOBAL VOD', checkGlobalVod, failures);

            for (const region of ['tr', 'us']) {
              await runCheck(`${region.toUpperCase()} dynamic`, () => checkDynamicRegion(region), failures);
            }

            if (failures.length) {
              throw new Error(`Production smoke failed:\n- ${failures.join('\n- ')}`);
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE