name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "regions/**"
      - "assets/**"
      - "cloudflare/**"
      - "scripts/build-cloudflare.js"
      - "scripts/build-cloudflare-worker.js"
      - "package.json"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 7b21859ab1740325151b97717cedc0e7
      CLOUDFLARE_PROJECT_NAME: nuvio-last-aziriel2020-1343705637
      PUBLIC_ORIGIN: https://nuvio-last-aziriel2020-1343705637.pages.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run regression tests
        run: |
          npm test
          npm run test:cloudflare

      - name: Build Cloudflare Pages output
        run: npm run build:cloudflare

      - name: Verify Cloudflare Pages project
        shell: bash
        run: |
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Accept: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT_NAME" \
            -o "$RUNNER_TEMP/cloudflare-existing-project.json"
          node - "$RUNNER_TEMP/cloudflare-existing-project.json" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!payload?.success || payload?.result?.name !== process.env.CLOUDFLARE_PROJECT_NAME) {
            throw new Error('Expected Cloudflare Pages project was not found.');
          }
          console.log('Cloudflare Pages project exists.');
          NODE

      - name: Verify Cloudflare application credentials
        shell: bash
        run: |
          curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Accept: application/json"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT_NAME"             -o "$RUNNER_TEMP/cloudflare-project-after.json"
          node - "$RUNNER_TEMP/cloudflare-project-after.json" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const vars = payload?.result?.deployment_configs?.production?.env_vars || {};
          if (!vars.TMDB_READ_TOKEN && !vars.TMDB_API_KEY) {
            throw new Error('Cloudflare has no TMDB credential.');
          }
          console.log('Cloudflare TMDB credential is configured.');
          NODE

      - name: Deploy Cloudflare-native Nuvio
        id: deploy
        shell: bash
        run: |
          npx --yes wrangler@latest pages deploy dist             --project-name="$CLOUDFLARE_PROJECT_NAME"             --branch=main             --commit-hash="$GITHUB_SHA"

      - name: Verify Cloudflare-only production
        shell: bash
        run: |
          node - <<'NODE'
          const origin = process.env.PUBLIC_ORIGIN;

          async function retry(path, attempts = 8) {
            let response = null;
            for (let attempt = 1; attempt <= attempts; attempt++) {
              try {
                response = await fetch(origin + path, { redirect: 'follow' });
                if (response.ok) return response;
              } catch {}
              await new Promise((resolve) => setTimeout(resolve, attempt * 1500));
            }
            throw new Error(`${path} failed with HTTP ${response?.status ?? 'no response'}`);
          }

          async function checkStatic() {
            const checks = [
              '/',
              '/edge-build.json',
              '/nuvio-collections-fr-global-tr-usa.json',
              '/nuvio-collections-desktop.json',
              '/fr/manifest.json',
              '/global/manifest.json',
              '/tr/manifest.json',
              '/us/manifest.json'
            ];
            for (const path of checks) {
              const response = await retry(path);
              if (path === '/nuvio-collections-fr-global-tr-usa.json') {
                const data = await response.json();
                if (!Array.isArray(data) || data.length !== 47) throw new Error('Unexpected collection count');
                const text = JSON.stringify(data);
                if (/vercel\.app/i.test(text)) throw new Error('Collections still reference Vercel');
              } else {
                await response.arrayBuffer();
              }
              console.log(`STATIC OK ${path}`);
            }
          }

          async function checkDynamicRegion(region) {
            const manifest = await (await retry(`/${region}/manifest.json`)).json();
            const catalog = manifest.catalogs.find((entry) => /today/i.test(entry.id));
            if (!catalog) throw new Error(`No Today catalog found for ${region}`);
            const path = `/${region}/catalog/${catalog.type}/${catalog.id}.json`;
            const response = await retry(path, 6);
            const edge = response.headers.get('x-nuvio-origin');
            if (edge !== 'cloudflare-only') {
              throw new Error(`${path} is not served by the Cloudflare-native runtime: ${edge}`);
            }
            const payload = await response.json();
            if (!Array.isArray(payload?.metas)) throw new Error(`${path} did not return metas`);
            console.log(`DYNAMIC OK ${path} (${payload.metas.length} metas)`);
          }

          async function main() {
            await checkStatic();
            const health = await retry('/health');
            if (health.headers.get('x-nuvio-origin') !== 'cloudflare-only') throw new Error('/health is not Cloudflare-native');
            await health.arrayBuffer();

            const shieldCard = await fetch(origin + '/fr/calendar-card.svg?title=Cloudflare&type=movie');
            if (![200, 400].includes(shieldCard.status) || !String(shieldCard.headers.get('content-type') || '').includes('image/svg+xml')) {
              throw new Error(`Shield calendar card is not SVG (HTTP ${shieldCard.status})`);
            }
            if (shieldCard.headers.get('x-nuvio-origin') !== 'cloudflare-only') {
              throw new Error('Shield calendar card is not Cloudflare-native');
            }

            const desktopCard = await retry('/fr/desktop-folder-card.jpg?provider=netflix&type=series');
            if (!String(desktopCard.headers.get('content-type') || '').startsWith('image/')) {
              throw new Error('Desktop folder card is not an image');
            }

            for (const region of ['fr', 'global', 'tr', 'us']) {
              await checkDynamicRegion(region);
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
