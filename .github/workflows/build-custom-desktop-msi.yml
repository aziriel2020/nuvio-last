name: Build Custom NuvioDesktop MSI

on:
  push:
    branches:
      - desktop-hover-hero-msi
    paths:
      - 'desktop-msi/**'
      - '.github/workflows/build-custom-desktop-msi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-msi:
    runs-on: windows-2022
    env:
      DESKTOP_REPO: https://github.com/NuvioMedia/NuvioDesktop.git
      DESKTOP_REF: Dev
      WEBVIEW2_VERSION: 1.0.4078.44
      TORRSERVER_WINDOWS_SHA256: 13031185a54abe0f729f9f3bdb7271a349a89ac8c559327d773c66007ed604f4

    steps:
      - name: Checkout builder
        uses: actions/checkout@v6

      - name: Checkout official NuvioDesktop
        shell: pwsh
        run: |
          git clone --branch "$env:DESKTOP_REF" --depth 1 "$env:DESKTOP_REPO" NuvioDesktop
          if ($LASTEXITCODE -ne 0) { throw "Failed to clone NuvioDesktop" }
          Push-Location NuvioDesktop
          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**,composeApp/src/desktopMain/resources/torrserver/windows-amd64/TorrServer.exe" --exclude=""
          Pop-Location

      - name: Apply Desktop hover Hero patch
        shell: pwsh
        run: |
          python desktop-msi/patch_hover_hero.py NuvioDesktop

      - name: Verify patch shape
        shell: pwsh
        run: |
          if (-not (Select-String -Path "NuvioDesktop/composeApp/src/commonMain/kotlin/com/nuvio/app/features/home/components/HomeHeroSection.kt" -Pattern "DesktopHoveredHomeHeroFrame" -Quiet)) { throw "Hero patch missing" }
          if (-not (Select-String -Path "NuvioDesktop/composeApp/src/commonMain/kotlin/com/nuvio/app/features/home/components/HomePosterCard.kt" -Pattern "onHoverChange" -Quiet)) { throw "Hover patch missing" }

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure desktop runtime
        shell: bash
        working-directory: NuvioDesktop
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}
        run: |
          missing=()
          for name in NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET; do
            if [[ -z "${!name}" ]]; then missing+=("${name}"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required builder secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          cat > local.properties <<EOF
          NUVIO_SUPABASE_URL=${NUVIO_SUPABASE_URL}
          NUVIO_SUPABASE_ANON_KEY=${NUVIO_SUPABASE_ANON_KEY}
          TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID}
          TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET}
          SENTRY_DESKTOP_DSN=${SENTRY_DESKTOP_DSN}
          EOF

      - name: Validate Windows runtime assets
        shell: bash
        working-directory: NuvioDesktop
        run: |
          runtime_path="composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          test -f "${runtime_path}"
          runtime_size="$(wc -c < "${runtime_path}")"
          if (( runtime_size < 1000000 )); then
            echo "Bundled Windows libmpv runtime not materialized from Git LFS." >&2
            exit 1
          fi
          torrserver_path="composeApp/src/desktopMain/resources/torrserver/windows-amd64/TorrServer.exe"
          test -f "${torrserver_path}"
          torrserver_sha256="$(sha256sum "${torrserver_path}" | awk '{print $1}')"
          if [[ "${torrserver_sha256}" != "${TORRSERVER_WINDOWS_SHA256}" ]]; then
            echo "TorrServer checksum mismatch." >&2
            exit 1
          fi

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload `
            -NonInteractive `
            -NoCache
          $webView2Root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          $loaderLibrary = Join-Path $webView2Root "build\native\x64\WebView2Loader.dll.lib"
          if (-not (Test-Path $loaderLibrary)) { throw "WebView2Loader.dll.lib not found" }
          "WEBVIEW2_ROOT=$webView2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Desktop tests
        shell: pwsh
        working-directory: NuvioDesktop
        run: |
          & .\gradlew.bat :composeApp:desktopTest "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" --no-configuration-cache --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { throw "Desktop tests failed" }

      - name: Build MSI
        shell: pwsh
        working-directory: NuvioDesktop
        run: |
          & .\gradlew.bat :composeApp:packageReleaseMsi "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" "-Pcompose.desktop.packaging.checkJdkVendor=false" --no-configuration-cache --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { throw "MSI build failed" }

      - name: Locate MSI
        shell: pwsh
        working-directory: NuvioDesktop
        run: |
          $msi = Get-ChildItem "composeApp\build\compose" -Recurse -Filter "*.msi" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $msi) { throw "No MSI produced" }
          $hash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "MSI_PATH=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSI_NAME=$($msi.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSI_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-desktop-hover-hero-windows-msi
          path: ${{ env.MSI_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        shell: pwsh
        run: |
          @"
          ## NuvioDesktop Hover Hero MSI
          - Source: NuvioMedia/NuvioDesktop@$env:DESKTOP_REF
          - Hover: poster -> main Hero
          - Metadata: addon meta + TMDb enrichment
          - Trailer: existing in-app YouTube trailer engine
          - MSI: $env:MSI_NAME
          - SHA256: $env:MSI_SHA256
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
